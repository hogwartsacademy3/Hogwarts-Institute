<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Monopoly Hogwarts Institute</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--gold:#d4b06a;
--bg:#08111d;
--panel:#101d2d;
--cream:#efe4c8;
--red:#a4161a;
--green:#1ea65a;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#02060d;
font-family:Inter,sans-serif;
overflow:hidden;
color:white;
}

#app{
display:flex;
height:100vh;
}

#boardWrap{
flex:1;
display:flex;
justify-content:center;
align-items:center;
overflow:auto;
background:
radial-gradient(circle,#173152,#03070d);
}

#board{
position:relative;
width:min(96vw,96vh);
aspect-ratio:1;
background:url("file_00000000004a481f491876e005d0f567d.png") center/cover no-repeat;
border-radius:18px;
box-shadow:
0 0 40px rgba(0,0,0,.6),
0 0 20px rgba(212,176,106,.3);
}

#pieces,
#houses{
position:absolute;
inset:0;
pointer-events:none;
}

.piece{
position:absolute;
width:24px;
height:24px;
border-radius:50%;
border:3px solid white;
transition:none;
box-shadow:0 0 12px rgba(255,255,255,.7);
}

.house{
position:absolute;
width:13px;
height:13px;
background:#1bbf63;
border:2px solid white;
border-radius:3px;
}

.hotel{
position:absolute;
width:18px;
height:18px;
background:#c01717;
border:2px solid white;
border-radius:3px;
}

#side{
width:340px;
background:linear-gradient(#0e1a2a,#050c16);
border-left:2px solid rgba(212,176,106,.3);
display:flex;
flex-direction:column;
}

.topTitle{
font-family:Cinzel;
text-align:center;
font-size:26px;
padding:18px;
color:var(--gold);
border-bottom:1px solid rgba(212,176,106,.25);
}

.panel{
margin:14px;
padding:14px;
background:rgba(255,255,255,.05);
border:1px solid rgba(212,176,106,.2);
border-radius:16px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:8px;
background:#17283d;
color:white;
}

button{
width:100%;
margin-top:10px;
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
background:linear-gradient(#d9b96f,#b98d3c);
color:#201300;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

#dice{
display:flex;
justify-content:center;
gap:12px;
margin-top:12px;
}

.die{
width:72px;
height:72px;
background:#f8f8f8;
border-radius:16px;
position:relative;
box-shadow:0 8px 20px rgba(0,0,0,.4);
}

.dot{
width:11px;
height:11px;
background:#111;
border-radius:50%;
position:absolute;
opacity:0;
}

.log{
flex:1;
overflow:auto;
padding:12px;
font-size:13px;
line-height:1.5;
}

.playerCard{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.turnGlow{
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 6px var(--gold);}
to{box-shadow:0 0 20px var(--gold);}
}

@media(max-width:900px){
#app{
flex-direction:column;
}

#side{
width:100%;
height:38vh;
}

#board{
width:100vw;
}
}
</style>
</head>

<body>

<div id="app">

<div id="boardWrap">

<div id="board">

<div id="houses"></div>
<div id="pieces"></div>

</div>

</div>

<div id="side">

<div class="topTitle">
MONOPOLY
<br>
HOGWARTS INSTITUTE
</div>

<div class="panel">

<div>Nama</div>
<input id="name" placeholder="Masukkan nama">

<div style="margin-top:10px;">Room</div>
<input id="room" placeholder="Contoh: HOGWARTS">

<button id="joinBtn">Masuk Room</button>

</div>

<div class="panel">

<div style="font-weight:bold;">Giliran</div>

<div id="turnText" style="margin-top:8px;">
Belum bergabung
</div>

<div id="dice">

<div class="die" id="die1"></div>

<div class="die" id="die2"></div>

</div>

<button id="rollBtn" disabled>Roll Dice</button>

</div>

<div class="panel">

<div style="font-weight:bold;">Pemain</div>

<div id="playersList"></div>

</div>

<div class="log" id="log"></div>

</div>

</div>

<script>

const supabase=window.supabase.createClient(
"https://wrhxzczvlfmdybuyslcv.supabase.co",
"sb_publishable_d-AKVoEiwg_2xMPUCeiaLQ_Gnvn3kIe"
);

const board=document.getElementById("board");
const piecesLayer=document.getElementById("pieces");
const housesLayer=document.getElementById("houses");

const COLORS=[
"#e63946",
"#3a86ff",
"#ffbe0b",
"#2ecc71",
"#9d4edd",
"#ff7b00",
"#00c2a8",
"#ffffff"
];

let state={
room:"",
me:"",
players:[],
properties:{},
turn:0
};

const log=t=>{
const el=document.getElementById("log");
el.innerHTML+=t+"<br>";
el.scrollTop=el.scrollHeight;
};

const CELL=[
{x:90,y:1140},{x:155,y:1140},{x:220,y:1140},{x:285,y:1140},{x:350,y:1140},
{x:415,y:1140},{x:480,y:1140},{x:545,y:1140},{x:610,y:1140},{x:675,y:1140},
{x:742,y:1140},

{x:1145,y:1085},{x:1145,y:1000},{x:1145,y:915},{x:1145,y:830},{x:1145,y:745},
{x:1145,y:660},{x:1145,y:575},{x:1145,y:490},{x:1145,y:405},{x:1145,y:320},

{x:1085,y:90},{x:1000,y:90},{x:915,y:90},{x:830,y:90},{x:745,y:90},
{x:660,y:90},{x:575,y:90},{x:490,y:90},{x:405,y:90},{x:320,y:90},

{x:90,y:155},{x:90,y:240},{x:90,y:325},{x:90,y:410},{x:90,y:495},
{x:90,y:580},{x:90,y:665},{x:90,y:750},{x:90,y:835}
];

const BOARD_SIZE=1250;

function px(v){
return(v/BOARD_SIZE)*board.clientWidth;
}

function renderPlayers(){

piecesLayer.innerHTML="";

state.players.forEach((p,i)=>{

const d=document.createElement("div");
d.className="piece";

d.style.background=COLORS[i%COLORS.length];

const pos=CELL[p.position||0];

d.style.left=px(pos.x)-12+"px";
d.style.top=px(pos.y)-12+"px";

piecesLayer.appendChild(d);

});

renderSidebar();

}

function renderSidebar(){

const wrap=document.getElementById("playersList");
wrap.innerHTML="";

state.players.forEach((p,i)=>{

const row=document.createElement("div");
row.className="playerCard";

if(i===state.turn)
row.classList.add("turnGlow");

row.innerHTML=`
<div style="display:flex;align-items:center;gap:8px;">
<div style="
width:14px;
height:14px;
border-radius:50%;
background:${COLORS[i]};
"></div>
${p.name}
</div>
<div>£${p.money}</div>
`;

wrap.appendChild(row);

});

const me=state.players.find(x=>x.id===state.me);

if(me)
document.getElementById("turnText").innerHTML=
`${me.name}<br>Saldo £${me.money}`;

}

const DOTMAP={
1:[[1,1]],
2:[[0,0],[2,2]],
3:[[0,0],[1,1],[2,2]],
4:[[0,0],[2,0],[0,2],[2,2]],
5:[[0,0],[2,0],[1,1],[0,2],[2,2]],
6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]
};

function drawDie(id,val){

const die=document.getElementById(id);
die.innerHTML="";

for(let y=0;y<3;y++){

for(let x=0;x<3;x++){

const dot=document.createElement("div");
dot.className="dot";

dot.style.left=12+x*24+"px";
dot.style.top=12+y*24+"px";

die.appendChild(dot);

}

}

DOTMAP[val].forEach(([x,y])=>{

const idx=y*3+x;

die.children[idx].style.opacity=1;

});

}

async function rollAnimation(){

for(let i=0;i<12;i++){

drawDie("die1",1+Math.floor(Math.random()*6));
drawDie("die2",1+Math.floor(Math.random()*6));

await new Promise(r=>setTimeout(r,70));

}

const a=1+Math.floor(Math.random()*6);
const b=1+Math.floor(Math.random()*6);

drawDie("die1",a);
drawDie("die2",b);

return[a,b];

}

async function animatePiece(index,steps){

const el=piecesLayer.children[index];

let pos=state.players[index].position;

for(let i=0;i<steps;i++){

pos=(pos+1)%40;

const c=CELL[pos];

el.animate([
{
left:el.style.left,
top:el.style.top
},
{
left:px(c.x)-12+"px",
top:px(c.y)-12+"px"
}
],{
duration:180,
fill:"forwards",
easing:"ease-in-out"
});

await new Promise(r=>setTimeout(r,180));

el.style.left=px(c.x)-12+"px";
el.style.top=px(c.y)-12+"px";

}

state.players[index].position=pos;

}

window.addEventListener("resize",renderPlayers);

function createPlayer(name,id){

return{
id,
name,
position:0,
money:1500,
jail:false,
jailTurn:0,
properties:[]
};

}

async function updateTurn(){

document.getElementById("rollBtn").disabled=
state.players[state.turn]?.id!==state.me;

}

async function savePlayers(){

await supabase
.from("players")
.upsert(state.players);

}

async function nextTurn(){

state.turn=(state.turn+1)%state.players.length;

await supabase
.from("rooms")
.update({turn:state.turn})
.eq("code",state.room);

await updateTurn();

}

async function moveCurrent(steps){

const idx=state.turn;

await animatePiece(idx,steps);

renderPlayers();

await savePlayers();

}

const PROPERTY={
1:{name:"Hogsmeade Lane",price:60,rent:[2,10,30,90,160,250],group:"brown"},
3:{name:"Owl Post",price:60,rent:[4,20,60,180,320,450],group:"brown"},
6:{name:"Greenhouse",price:100,rent:[6,30,90,270,400,550],group:"lightblue"},
8:{name:"Library Wing",price:100,rent:[6,30,90,270,400,550],group:"lightblue"},
9:{name:"Astronomy Tower",price:120,rent:[8,40,100,300,450,600],group:"lightblue"},
11:{name:"Hufflepuff Common",price:140,rent:[10,50,150,450,625,750],group:"pink"},
13:{name:"Ravenclaw Common",price:140,rent:[10,50,150,450,625,750],group:"pink"},
14:{name:"Slytherin Common",price:160,rent:[12,60,180,500,700,900],group:"pink"},
16:{name:"Great Hall",price:180,rent:[14,70,200,550,750,950],group:"orange"},
18:{name:"Potions Room",price:180,rent:[14,70,200,550,750,950],group:"orange"},
19:{name:"Defence Room",price:200,rent:[16,80,220,600,800,1000],group:"orange"},
21:{name:"Forbidden Forest",price:220,rent:[18,90,250,700,875,1050],group:"red"},
23:{name:"Whomping Willow",price:220,rent:[18,90,250,700,875,1050],group:"red"},
24:{name:"Shrieking Shack",price:240,rent:[20,100,300,750,925,1100],group:"red"},
26:{name:"Diagon Alley",price:260,rent:[22,110,330,800,975,1150],group:"yellow"},
27:{name:"Gringotts",price:260,rent:[22,110,330,800,975,1150],group:"yellow"},
29:{name:"Knockturn Alley",price:280,rent:[24,120,360,850,1025,1200],group:"yellow"},
31:{name:"Ministry",price:300,rent:[26,130,390,900,1100,1275],group:"green"},
32:{name:"St Mungo",price:300,rent:[26,130,390,900,1100,1275],group:"green"},
34:{name:"Hogwarts Express",price:320,rent:[28,150,450,1000,1200,1400],group:"green"},
37:{name:"Room of Requirement",price:350,rent:[35,175,500,1100,1300,1500],group:"darkblue"},
39:{name:"Headmaster Office",price:400,rent:[50,200,600,1400,1700,2000],group:"darkblue"}
};

function ownerOf(tile){
return state.players.find(p=>p.properties?.includes(tile));
}

async function landAction(player){

const tile=player.position;

if(tile===0){
player.money+=200;
log(`${player.name} melewati GO (+£200)`);
return;
}

if(tile===30){
player.position=10;
player.jail=true;
log(`${player.name} masuk Jail!`);
renderPlayers();
return;
}

const prop=PROPERTY[tile];

if(!prop) return;

const owner=ownerOf(tile);

if(!owner){

if(player.money>=prop.price){

const buy=confirm(`Beli ${prop.name} seharga £${prop.price}?`);

if(buy){

player.money-=prop.price;

if(!player.properties)
player.properties=[];

player.properties.push(tile);

state.properties[tile]={owner:player.id,level:0};

renderBuildings();

log(`${player.name} membeli ${prop.name}`);

}

}

}else if(owner.id!==player.id){

const lvl=state.properties[tile]?.level||0;

const rent=prop.rent[lvl];

player.money-=rent;
owner.money+=rent;

log(`${player.name} membayar £${rent} kepada ${owner.name}`);

}

}

function renderBuildings(){

housesLayer.innerHTML="";

Object.entries(state.properties).forEach(([tile,data])=>{

const c=CELL[tile];

const x=px(c.x);
const y=px(c.y);

if(data.level<5){

for(let i=0;i<data.level;i++){

const h=document.createElement("div");
h.className="house";

h.style.left=x-18+i*10+"px";
h.style.top=y-28+"px";

housesLayer.appendChild(h);

}

}else{

const hotel=document.createElement("div");
hotel.className="hotel";

hotel.style.left=x-9+"px";
hotel.style.top=y-30+"px";

housesLayer.appendChild(hotel);

}

});

}

document.getElementById("joinBtn").onclick=async()=>{

const name=document.getElementById("name").value.trim();
const room=document.getElementById("room").value.trim().toUpperCase();

if(!name||!room) return;

state.room=room;
state.me=crypto.randomUUID();

const me=createPlayer(name,state.me);

state.players.push(me);

await supabase.from("rooms").upsert({
code:room,
turn:0
});

await supabase.from("players").insert({
id:me.id,
room,
name:me.name,
position:0,
money:1500,
properties:[]
});

await loadRoom();

document.getElementById("rollBtn").disabled=false;

log(`Masuk room ${room}`);

};

async function loadRoom(){

const {data}=await supabase
.from("players")
.select("*")
.eq("room",state.room);

state.players=data||[];

const {data:r}=await supabase
.from("rooms")
.select("*")
.eq("code",state.room)
.single();

state.turn=r?.turn||0;

renderPlayers();
renderBuildings();
updateTurn();

subscribeRealtime();

}

let channel;

function subscribeRealtime(){

if(channel)
supabase.removeChannel(channel);

channel=supabase
.channel(state.room)

.on("postgres_changes",{
event:"*",
schema:"public",
table:"players"
},async()=>{

const {data}=await supabase
.from("players")
.select("*")
.eq("room",state.room);

state.players=data||[];

renderPlayers();

})

.on("postgres_changes",{
event:"UPDATE",
schema:"public",
table:"rooms"
},payload=>{

if(payload.new.code===state.room){

state.turn=payload.new.turn;

updateTurn();
renderSidebar();

}

})

.subscribe();

}

document.getElementById("rollBtn").onclick=async()=>{

if(state.players[state.turn].id!==state.me)
return;

document.getElementById("rollBtn").disabled=true;

const[d1,d2]=await rollAnimation();

const total=d1+d2;

log(`${state.players[state.turn].name} mendapatkan ${total}`);

await moveCurrent(total);

await landAction(state.players[state.turn]);

await savePlayers();

if(d1!==d2)
await nextTurn();

updateTurn();

};

const CHANCE=[
()=>{const p=state.players[state.turn];p.money+=150;log(`${p.name} mendapat hadiah £150.`);},
()=>{const p=state.players[state.turn];p.money-=50;log(`${p.name} membayar denda £50.`);},
()=>{const p=state.players[state.turn];p.position=0;p.money+=200;log(`${p.name} maju ke GO (+£200).`);renderPlayers();},
()=>{const p=state.players[state.turn];p.position=10;p.jail=true;log(`${p.name} masuk Jail.`);renderPlayers();}
];

const CHEST=[
()=>{const p=state.players[state.turn];p.money+=100;log(`${p.name} menerima £100.`);},
()=>{const p=state.players[state.turn];p.money-=100;log(`${p.name} kehilangan £100.`);},
()=>{const p=state.players[state.turn];p.money+=50;log(`${p.name} menemukan Galleon (+£50).`);},
()=>{const p=state.players[state.turn];p.money-=25;log(`${p.name} membayar biaya ramuan (£25).`);}
];

async function specialTiles(player){

const t=player.position;

if(t===2||t===17||t===33){
CHEST[Math.floor(Math.random()*CHEST.length)]();
}

if(t===7||t===22||t===36){
CHANCE[Math.floor(Math.random()*CHANCE.length)]();
}

if(t===20){
log("Free Parking.");
}

}

async function landAction(player){

const tile=player.position;

if(tile===30){
player.position=10;
player.jail=true;
renderPlayers();
log(`${player.name} dipenjara.`);
return;
}

const prop=PROPERTY[tile];

if(prop){

const owner=ownerOf(tile);

if(!owner){

if(player.money>=prop.price){

if(confirm(`Beli ${prop.name} (£${prop.price})?`)){

player.money-=prop.price;
player.properties.push(tile);
state.properties[tile]={owner:player.id,level:0};
renderBuildings();
log(`${player.name} membeli ${prop.name}.`);

}

}

}else if(owner.id!==player.id){

const lvl=state.properties[tile]?.level||0;
const rent=prop.rent[lvl];

player.money-=rent;
owner.money+=rent;

log(`${player.name} membayar sewa £${rent} kepada ${owner.name}.`);

}

}

await specialTiles(player);

if(player.money<0){

log(`${player.name} bangkrut!`);

await supabase.from("players").delete().eq("id",player.id);

state.players=state.players.filter(x=>x.id!==player.id);

renderPlayers();

}

}

async function upgrade(tile){

const prop=PROPERTY[tile];
const me=state.players.find(x=>x.id===state.me);

if(!prop||!me.properties.includes(tile)) return;

const obj=state.properties[tile];
const level=obj.level;

if(level>=5) return;

const cost=Math.floor(prop.price/2);

if(me.money<cost) return;

me.money-=cost;
obj.level++;

renderBuildings();
renderPlayers();
await savePlayers();

log(`${me.name} meng-upgrade ${prop.name} menjadi level ${obj.level}.`);

}

document.addEventListener("dblclick",e=>{

const rect=board.getBoundingClientRect();

const x=(e.clientX-rect.left)/rect.width*BOARD_SIZE;
const y=(e.clientY-rect.top)/rect.height*BOARD_SIZE;

let near=-1;
let dist=99999;

CELL.forEach((c,i)=>{

const d=Math.hypot(c.x-x,c.y-y);

if(d<dist){
dist=d;
near=i;
}

});

if(dist<45)
upgrade(near);

});

renderPlayers();

</script>

</body>
</html>
