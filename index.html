<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hogwarts Institute</title>
<style>
:root{--bg:#eee9df;--paper:#f8f5ee;--ink:#191817;--muted:#777066;--line:#cfc6b6;--accent:#7a2630;--gold:#9c772d;--dark:#181716}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:var(--dark);color:#ddd;padding:8px 5%;font:11px Arial,sans-serif;display:flex;justify-content:space-between;letter-spacing:.6px}.top button{background:none;border:0;color:#ddd;font-size:11px}.brand{text-align:center;background:var(--paper);padding:25px 15px 12px;border-bottom:1px solid var(--line)}.brand h1{margin:0;font-size:34px;letter-spacing:4px}.brand small{display:block;color:var(--muted);letter-spacing:3px;margin-top:7px;font:10px Arial,sans-serif}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:19px}nav button{border:0;background:transparent;padding:9px 12px;font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}nav button:hover,nav button.active{background:#e8e1d5}.wrap{width:min(1120px,91%);margin:28px auto}.hero{min-height:340px;background:linear-gradient(130deg,#25221e,#51483c);color:white;padding:48px 25px;display:grid;place-items:center;text-align:center}.hero .seal{font-size:54px}.hero h2{font-size:50px;margin:12px 0}.hero p{max-width:670px;line-height:1.7;color:#e8e1d5}.btn{border:1px solid var(--dark);background:var(--dark);color:white;padding:11px 17px}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}.section{margin:35px 0}.section h2{font-size:28px;border-bottom:1px solid var(--line);padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);padding:20px}.card h3{margin-top:0}.muted{color:var(--muted);line-height:1.6}.tag{display:inline-block;border:1px solid var(--line);padding:4px 8px;font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}.profile{display:grid;grid-template-columns:190px 1fr;gap:25px}.portrait{height:190px;background:#ddd6c9;display:grid;place-items:center;font-size:70px;border:1px solid var(--line)}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ded6c8;padding:10px 0}.field{margin:13px 0}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;background:#fffdf8;border:1px solid #bdb4a5}.field textarea{min-height:130px;resize:vertical}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:16px;text-align:left;background:#fffdf8;border:1px solid var(--line)}.choice.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.quiz{padding:17px 0;border-bottom:1px solid var(--line)}.quiz button{margin:6px 5px 0 0;padding:9px 12px;background:#fffdf8;border:1px solid var(--line)}.result{text-align:center;background:#e9e1d2;border:1px solid var(--line);padding:28px}.collection{min-height:155px}.check{font-size:24px;float:right}.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:12px 16px;border-radius:4px;font:13px Arial,sans-serif;box-shadow:0 5px 25px #0005}footer{margin-top:70px;background:var(--dark);color:#999;padding:30px;text-align:center;font:11px Arial,sans-serif}
@media(max-width:760px){.brand h1{font-size:25px}.hero{min-height:300px}.hero h2{font-size:38px}.grid,.grid2{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.portrait{height:150px}.choicegrid{grid-template-columns:1fr}}
</style></head>
<body>
<div class="top"><span>HOGWARTS INSTITUTE · PERSONAL ARCHIVE</span><span><button onclick="exportData()">Export</button> · <button onclick="importData()">Import</button></span></div>
<div class="brand"><h1>HOGWARTS INSTITUTE</h1><small>THE HOME OF WITCHCRAFT & WIZARDRY</small><nav id="nav"></nav></div>
<main id="app" class="wrap"></main>
<footer>Hogwarts Institute is a personal, fan-made web experience. It is not affiliated with or endorsed by Warner Bros. Entertainment or the official Harry Potter rights holders.</footer>
<script>
const KEY="hogwarts_institute_personal_v3";
const initial=()=>({profile:{name:"",bio:"",house:"",wand:null,patronus:"",pet:"Owl",year:"First Year",subject:"Charms",portrait:"🧙"},points:{Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0},collections:{spells:[],creatures:[],characters:[],places:[],objects:[],potions:[]},favorites:[],achievements:[],journal:"",daily:{date:"",done:false},settings:{theme:"light"}});
let S=load()||initial();
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function persist(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1700);persist()}
function go(p){location.hash=p;render()}
const pages=["home","profile","sorting","wand","patronus","houses","library","collections","quizzes","journal","settings","about"];
const names={home:"Home",profile:"Profile",sorting:"Sorting",wand:"Wand",patronus:"Patronus",houses:"Houses",library:"Library",collections:"Collections",quizzes:"Quizzes",journal:"Journal",settings:"Settings",about:"About"};
function render(){let p=location.hash.slice(1)||"home";if(!pages.includes(p))p="home";document.getElementById("nav").innerHTML=pages.map(x=>`<button class="${x===p?"active":""}" onclick="go('${x}')">${names[x]}</button>`).join("");document.getElementById("app").innerHTML=window["page_"+p]();window.scrollTo(0,0)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(t,d,b=""){return `<div class="card"><h3>${t}</h3><p class="muted">${d}</p>${b}</div>`}
function page_home(){return `<section class="hero"><div><div class="seal">✦</div><span class="tag">Personal Wizarding Archive</span><h2>A world of magic awaits.</h2><p>Welcome to your personal Hogwarts Institute. Discover your magical identity, record your collections, explore the Institute library and keep your own wizarding journal.</p><button class="btn gold" onclick="go('${S.profile.name?"profile":"sorting"}')">${S.profile.name?"Open My Profile":"Begin Your Journey"}</button></div></section>
<section class="section"><h2>Your Magical Identity</h2><div class="grid">${card("Sorting Ceremony","Discover which House best reflects your answers.","<button class='btn' onclick=\"go('sorting')\">Enter</button>")}${card("Wand Ceremony","Find your wood, core, length and flexibility.","<button class='btn' onclick=\"go('wand')\">Discover</button>")}${card("Patronus Experience","A short personality experience to reveal your Patronus.","<button class='btn' onclick=\"go('patronus')\">Discover</button>")}</div></section>
<section class="section"><h2>Institute Features</h2><div class="grid">${card("Library","Browse original entries for spells, creatures, characters, places, objects and potions.","<button class='btn light' onclick=\"go('library')\">Explore Library</button>")}${card("Collections","Mark discoveries as collected and build your personal magical archive.","<button class='btn light' onclick=\"go('collections')\">View Collections</button>")}${card("Daily Experience","Take the daily quiz and keep your Institute streak going.","<button class='btn light' onclick=\"go('quizzes')\">Open Quizzes</button>")}</div></section>`}
function page_profile(){let p=S.profile;if(!p.name)return `<div class="result"><h1>Your Profile</h1><p>Create your magical identity through the Sorting Ceremony.</p><button class="btn" onclick="go('sorting')">Begin</button></div>`;return `<section class="card"><div class="profile"><div class="portrait">${p.portrait}</div><div><span class="tag">${houseIcon(p.house)} ${p.house}</span><h1>${esc(p.name)}</h1><p class="muted">${esc(p.bio)||"A student of Hogwarts Institute."}</p><div class="row"><b>Year</b><span>${esc(p.year)}</span></div><div class="row"><b>Favourite subject</b><span>${esc(p.subject)}</span></div><div class="row"><b>Wand</b><span>${p.wand?esc(p.wand.wood)+" · "+esc(p.wand.core):"Not discovered"}</span></div><div class="row"><b>Patronus</b><span>${esc(p.patronus)||"Not discovered"}</span></div><div class="row"><b>Pet</b><span>${esc(p.pet)}</span></div><br><button class="btn" onclick="editProfile()">Edit Profile</button> <button class="btn light" onclick="persist();toast('Saved locally')">Save</button></div></div></section>`}
function editProfile(){let p=S.profile,n=prompt("Name:",p.name);if(n===null)return;p.name=n.trim()||p.name;p.bio=prompt("Short bio:",p.bio)??p.bio;p.year=prompt("Year:",p.year)??p.year;p.subject=prompt("Favourite subject:",p.subject)??p.subject;p.pet=prompt("Pet:",p.pet)??p.pet;p.portrait=prompt("Portrait emoji (e.g. 🧙):",p.portrait)??p.portrait;persist();render()}
let sa=[];
const sq=[["Which quality speaks to you most?","Courage","Ambition","Curiosity","Loyalty"],["In a crisis you...","Act","Strategise","Investigate","Support"],["What do you value?","Bravery","Achievement","Knowledge","Friendship"],["Your ideal evening?","Dueling","Planning","Reading","Talking"],["Your greatest strength?","Nerve","Determination","Wit","Patience"]];
function page_sorting(){if(S.profile.house)return `<div class="result"><div style="font-size:55px">${houseIcon(S.profile.house)}</div><h1>${S.profile.house}</h1><p>Your House has been recorded in your personal archive.</p><button class="btn" onclick="go('profile')">View Profile</button> <button class="btn light" onclick="redo('house')">Redo Ceremony</button></div>`;return `<section class="card"><h1>The Sorting Ceremony</h1><p class="muted">There is no wrong answer. Choose what feels most like you.</p>${sq.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><br>${q.slice(1).map((a,j)=>`<button onclick="sortAnswer(${i},${j})">${a}</button>`).join("")}</div>`).join("")}</section>`}
function sortAnswer(i,j){sa[i]=j;if(sa.length===sq.length&&sa.every(x=>x!==undefined)){let sc=[0,0,0,0];sa.forEach((x,i)=>sc[(x+i)%4]++);let h=["Gryffindor","Slytherin","Ravenclaw","Hufflepuff"][sc.indexOf(Math.max(...sc))];S.profile.house=h;S.points[h]+=25;achievement("Sorted");persist();render()}}
function redo(type){if(type==="house"){S.profile.house="";sa=[]}if(type==="wand"){S.profile.wand=null;wa=[]}if(type==="pat"){S.profile.patronus="";pa=[]}persist();render()}
let wa=[];
function page_wand(){if(S.profile.wand)return `<div class="result"><div style="font-size:55px">🪄</div><h1>Your Wand</h1><p style="font-size:20px">${esc(S.profile.wand.wood)} · ${esc(S.profile.wand.core)}</p><p>${esc(S.profile.wand.length)} · ${esc(S.profile.wand.flex)}</p><button class="btn light" onclick="redo('wand')">Discover Again</button></div>`;return `<section class="card"><h1>The Wand Ceremony</h1><p class="muted">Three choices. One wand.</p>${["Which atmosphere attracts you?","How do you solve a mystery?","Choose a place."].map((q,i)=>`<div class="quiz"><b>${q}</b><br>${["Forest","Storm","Library","Lake"].map((a,j)=>`<button onclick="wandAnswer(${i},${j})">${a}</button>`).join("")}</div>`).join("")}</section>`}
function wandAnswer(i,j){wa[i]=j;if(wa.length===3&&wa.every(x=>x!==undefined)){let w=["Ash","Yew","Rowan","Hawthorn"],c=["Phoenix feather","Dragon heartstring","Unicorn hair","Moonstone thread"],f=["Supple","Springy","Rigid","Unyielding"];S.profile.wand={wood:w[(wa[0]+wa[1])%4],core:c[(wa[1]+wa[2])%4],length:(10+(wa[0]+wa[2])%6)+"¾ inches",flex:f[(wa[0]+wa[2])%4]};achievement("Wand Chosen");persist();render()}}
let pa=[];
function page_patronus(){if(S.profile.patronus)return `<div class="result"><div style="font-size:55px">✦</div><h1>Your Patronus</h1><p style="font-size:30px">${S.profile.patronus}</p><button class="btn light" onclick="redo('pat')">Discover Again</button></div>`;return `<section class="card"><h1>The Patronus Experience</h1>${["What guides you?","Where would you rather be?","What do others trust you with?"].map((q,i)=>`<div class="quiz"><b>${q}</b><br>${["Hope","Curiosity","Loyalty","Freedom"].map((a,j)=>`<button onclick="patAnswer(${i},${j})">${a}</button>`).join("")}</div>`).join("")}</section>`}
function patAnswer(i,j){pa[i]=j;if(pa.length===3&&pa.every(x=>x!==undefined)){S.profile.patronus=["Stag","Fox","Owl","Wolf","Hare","Otter","Raven","Cat","Doe","Horse","Swan","Badger"][(pa[0]*3+pa[1]*2+pa[2])%12];achievement("Patronus Discovered");persist();render()}}
function page_houses(){let a=[["Gryffindor","Courage, nerve and chivalry.","🦁"],["Slytherin","Ambition, resourcefulness and determination.","🐍"],["Ravenclaw","Wit, learning and wisdom.","🦅"],["Hufflepuff","Loyalty, patience and fair play.","🦡"]];return `<section class="section"><h1>The Four Houses</h1><div class="grid">${a.map(x=>`<div class="card"><div style="font-size:45px">${x[2]}</div><h2>${x[0]}</h2><p class="muted">${x[1]}</p><div class="row"><span>Personal points</span><b>${S.points[x[0]]}</b></div></div>`).join("")}</div></section>`}
const lib={spells:[["Lumen","Light","A controlled orb of illumination."],["Aegis","Defence","A short-lived magical barrier."],["Ember","Charms","A focused spark of heat."],["Frost","Charms","A cold projectile that slows movement."]],creatures:[["Mooncalf","Creature","A shy nocturnal creature with wide eyes."],["Thestral","Creature","A mysterious winged being associated with those who understand loss."],["Kneazle","Creature","A clever cat-like magical companion."],["Bowtruckle","Creature","A small guardian of wand-wood trees."]],characters:[["The Archivist","Character","A fictional keeper of the Institute's Restricted Archive."],["Professor Vale","Character","A fictional professor of defensive magic."],["Mira Rowan","Character","A fictional seventh-year student and duelling champion."]],places:[["Great Hall","Place","The ceremonial centre of the Institute."],["Owlery","Place","A tower for magical correspondence."],["Restricted Archive","Place","A supervised collection of unusual texts."],["Greenhouses","Place","Enchanted gardens for magical botany."]],objects:[["Marauder's Compass","Object","An original Institute artifact said to reveal hidden routes."],["Memory Locket","Object","A locket used to preserve a single vivid memory."],["Star Map","Object","A magical chart that changes with the night sky."]],potions:[["Focus Draught","Potion","A study aid that sharpens concentration."],["Restorative Tonic","Potion","A mild restorative mixture used after tiring lessons."],["Dreamless Sleep","Potion","A fictional sleep potion for the Institute archive."]]};
let cat="spells";
function page_library(){return `<section class="section"><h1>Institute Library</h1><p class="muted">Original reference entries for your personal archive.</p><div class="choicegrid">${Object.keys(lib).map(k=>`<button class="choice ${cat===k?"selected":""}" onclick="cat='${k}';render()">${k.toUpperCase()}</button>`).join("")}</div><br><div class="grid">${lib[cat].map(x=>{let id=x[0];let yes=S.collections[cat]?.includes(id);return `<div class="card collection"><span class="tag">${x[1]}</span>${yes?'<span class="check">✓</span>':""}<h3>${x[0]}</h3><p class="muted">${x[2]}</p><button class="btn light" onclick="toggleCollection('${cat}','${id.replace(/'/g,"\\'")}')">${yes?"Collected":"Add to Collection"}</button></div>`}).join("")}</div></section>`}
function toggleCollection(c,id){S.collections[c]=S.collections[c]||[];let i=S.collections[c].indexOf(id);i<0?S.collections[c].push(id):S.collections[c].splice(i,1);if(Object.values(S.collections).flat().length>=5)achievement("Curious Mind");persist();render()}
function page_collections(){let total=Object.values(S.collections).flat().length;return `<section class="section"><h1>My Collections</h1><div class="result"><b style="font-size:30px">${total}</b><br>discoveries collected</div><br><div class="grid">${Object.entries(lib).map(([k,v])=>`<div class="card"><h3>${k}</h3><p class="muted">${(S.collections[k]||[]).length} / ${v.length} collected</p><div class="row"><span>Progress</span><b>${Math.round((S.collections[k]||[]).length/v.length*100)}%</b></div></div>`).join("")}</div></section>`}
let qa=[];
const quiz=[["Which quality is most associated with Ravenclaw?","Courage","Wit","Ambition","Loyalty",1],["Which item belongs in a wandmaker's workshop?","Core","Cauldron only","Broomstick","Quill only",0],["Which place is best suited to magical botany?","Owlery","Greenhouses","Duelling Hall","Great Hall",1],["What is a Patronus best described as?","A magical guardian","A potion","A school subject","A House",0]];
function page_quizzes(){let today=new Date().toISOString().slice(0,10);let done=S.daily.date===today&&S.daily.done;return `<section class="card"><h1>Daily Quiz</h1><p class="muted">One small magical challenge each day. Today: ${today}</p>${done?`<div class="result"><h2>Completed ✓</h2><p>Come back tomorrow for another challenge.</p></div>`:quiz.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><br>${q.slice(1,5).map((a,j)=>`<button onclick="quizA(${i},${j})">${a}</button>`).join("")}</div>`).join("")}<div id="qres"></div></section>`}
function quizA(i,j){qa[i]=j;if(qa.length===quiz.length&&qa.every(x=>x!==undefined)){let score=qa.reduce((n,x,i)=>n+(x===quiz[i][5]?1:0),0);S.daily={date:new Date().toISOString().slice(0,10),done:true};if(score===quiz.length)achievement("Perfect Scholar");else achievement("Quiz Taker");persist();document.getElementById("qres").innerHTML=`<div class="result"><h2>${score}/${quiz.length}</h2><p>Today's quiz is complete.</p></div>`}}
function page_journal(){return `<section class="card"><h1>My Journal</h1><p class="muted">Private notes stored only in this browser.</p><textarea id="journal">${esc(S.journal)}</textarea><br><br><button class="btn" onclick="S.journal=document.getElementById('journal').value;persist();toast('Journal saved locally')">Save Journal</button></section>`}
function page_settings(){return `<section class="card"><h1>Settings & Data</h1><p class="muted">This Institute is intentionally local. No account or server is required.</p><div class="row"><b>Storage</b><span>Browser localStorage</span></div><div class="row"><b>Profile data</b><span>Local to this browser</span></div><br><button class="btn" onclick="exportData()">Export My Data</button> <button class="btn light" onclick="importData()">Import Data</button><br><br><button class="btn light" onclick="resetAll()">Reset Everything</button></section>`}
function page_about(){return `<section class="card"><h1>About Hogwarts Institute</h1><p class="muted">A personal, fan-made wizarding-school interface inspired by the idea of personalised magical profiles, quizzes, House discovery, wand and Patronus experiences, collections and editorial discovery.</p><p class="muted">The content and interface here are original. This site does not copy the official Wizarding World website or its private systems.</p><h3>Privacy</h3><p class="muted">Your profile, collections and journal are stored locally in your browser. GitHub Pages only hosts the files. Nothing is sent to a database by this page.</p></section>`}
function achievement(x){if(!S.achievements.includes(x)){S.achievements.push(x);toast("Achievement unlocked: "+x)}}
function houseIcon(h){return {Gryffindor:"🦁",Slytherin:"🐍",Ravenclaw:"🦅",Hufflepuff:"🦡"}[h]||"✦"}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hogwarts-institute-profile.json";a.click();URL.revokeObjectURL(a.href)}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!x.collections)throw 0;S=x;persist();render();toast("Data imported")}catch(e){alert("Invalid Hogwarts Institute data.")}};r.readAsText(i.files[0])};i.click()}
function resetAll(){if(confirm("Reset all local Hogwarts Institute data?")){localStorage.removeItem(KEY);S=initial();render()}}
window.addEventListener("hashchange",render);window.addEventListener("beforeunload",()=>persist());render();
</script></body></html>
