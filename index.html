
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hogwarts Institute Monopoly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d1b;color:#f5f0df;
 font-family:Georgia,serif;
}
button,input{font:inherit}
button{
 border:0;border-radius:10px;padding:12px 16px;
 background:#d9ad57;color:#15100a;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.4;cursor:not-allowed}
input{
 width:100%;padding:12px;border-radius:8px;
 border:1px solid #4b5876;background:#10182b;color:white
}
.app{max-width:1500px;margin:auto;padding:16px}
header{
 display:flex;justify-content:space-between;align-items:center;
 padding:15px 0;border-bottom:1px solid #35415c
}
.logo{font-size:clamp(20px,4vw,35px);color:#e8bd68;font-weight:bold}
.muted{color:#aab4cb;font:13px Arial,sans-serif}
.panel{
 background:#151e34;border:1px solid #35425e;
 border-radius:16px;padding:16px
}
.layout{
 display:grid;grid-template-columns:minmax(0,1fr) 340px;
 gap:18px;margin-top:18px
}
.board-wrap{width:100%;overflow:hidden;border-radius:12px}
.board{
 position:relative;width:100%;aspect-ratio:1/1;
 background:url("https://raw.githubusercontent.com/hogwartsacademy3/Hogwarts-Institute/main/file_0000000004a481f491876e005d0f567d.png") center/100% 100% no-repeat;
}
.piece{
 position:absolute;z-index:10;width:clamp(22px,4vw,43px);
 height:clamp(22px,4vw,43px);border-radius:50%;
 border:3px solid white;transform:translate(-50%,-50%);
 display:flex;align-items:center;justify-content:center;
 font:bold 13px Arial,sans-serif;
 transition:left .16s linear,top .16s linear
}
.p0{background:#d9535b}.p1{background:#4b94e8}
.p2{background:#52c88d}.p3{background:#b779dc}
.building{
 position:absolute;z-index:5;transform:translate(-50%,-50%);
 font-size:clamp(15px,3vw,30px);
 filter:drop-shadow(0 2px 2px black)
}
.dice{
 width:85px;height:85px;padding:12px;margin:10px auto;
 display:grid;grid-template-columns:repeat(3,1fr);
 grid-template-rows:repeat(3,1fr);gap:5px;
 background:#f6f1e5;border-radius:14px
}
.dice i{display:block}
.dice .dot{background:#111;border-radius:50%}
.rolling{animation:shake .1s infinite}
@keyframes shake{
 0%{transform:rotate(0)}50%{transform:rotate(5deg)}
 100%{transform:rotate(-5deg)}
}
.stack{display:grid;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button:first-child{grid-column:span 2}
.player{
 display:flex;align-items:center;gap:10px;padding:10px;
 background:#0d1629;border:1px solid #2d3a56;border-radius:10px
}
.player.active{border-color:#e8bd68;background:#28344e}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.money{font:13px Arial,sans-serif;color:#6ee2a1}
.log{
 max-height:200px;overflow:auto;font:12px/1.6 Arial,sans-serif
}
.log div{padding:5px 0;border-bottom:1px solid #293650}
.hidden{display:none!important}
.badge{
 background:#293751;border-radius:30px;padding:5px 10px;
 color:#e8bd68;font:12px Arial,sans-serif
}
h2{margin:0 0 12px;font-size:20px}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
}
@media(max-width:500px){
 .app{padding:9px}.panel{padding:10px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div>
  <div class="logo">HOGWARTS INSTITUTE</div>
  <div class="muted">MAGICAL MONOPOLY</div>
 </div>
 <span class="badge" id="status">OFFLINE</span>
</header>

<div id="setup" class="panel" style="max-width:600px;margin:25px auto">
 <h2>🏰 Masuk Permainan</h2>
 <label class="muted">Nama pemain</label>
 <input id="name" maxlength="20" placeholder="Nama penyihir">

 <label class="muted">Kode room (kosong = buat baru)</label>
 <input id="room" maxlength="8" placeholder="Contoh: MAGIC7">

 <button id="join" style="width:100%;margin-top:12px">
  Masuk / Buat Room
 </button>
 <p id="setupMsg" class="muted"></p>
</div>

<div id="game" class="hidden">
<div class="layout">

<main class="panel">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
  <div>
   <h2>Papan Monopoly</h2>
   <div class="muted">Room: <b id="roomLabel">-</b></div>
  </div>
  <span class="badge" id="turnLabel">Menunggu</span>
 </div>

 <div class="board-wrap">
  <div class="board" id="board"></div>
 </div>

 <p class="muted">
  Bidak bergerak satu petak demi satu petak sesuai dadu.
 </p>
</main>

<aside class="stack">

<section class="panel">
 <h2>🎲 Dadu</h2>
 <div class="dice" id="dice">
  <i></i><i></i><i></i><i></i><i></i>
  <i></i><i></i><i></i><i></i>
 </div>
 <div class="muted" style="text-align:center" id="diceText">
  Belum dilempar
 </div>

 <div class="actions" style="margin-top:12px">
  <button id="roll" disabled>🎲 Lempar</button>
  <button id="buy" disabled>Beli</button>
  <button id="upgrade" disabled>Upgrade 🏠</button>
  <button id="end" disabled>Akhiri Giliran</button>
  <button id="start" disabled>🏰 Mulai Game</button>
 </div>
 <p class="muted" id="actionMsg"></p>
</section>

<section class="panel">
 <h2>👥 Pemain</h2>
 <div id="players" class="stack"></div>
</section>

<section class="panel">
 <h2>📜 Aktivitas</h2>
 <div id="log" class="log"></div>
</section>

</aside>
</div>
</div>
</div>

<script>
const URL="https://wrhxzczvlfmdybuyslcv.supabase.co";
const KEY="sb_publishable_d-AKVoEiwg_2xMPUCeiaLQ_Gnvn3kIe";
const db=supabase.createClient(URL,KEY);

const $=id=>document.getElementById(id);
const COLORS=["#d9535b","#4b94e8","#52c88d","#b779dc"];
const TOTAL=40;

let room=null,me=null,players=[],properties=[];
let rolled=false,moving=false,channel=null;

const propertyNames=[
"Start","Hogsmeade","Chance","Diagon Alley","Pajak","Azkaban",
"Hogwarts","Chance","Forbidden Forest","Library","Free Parking",
"Ravenclaw Tower","Chance","Slytherin Dungeon","Gryffindor Tower",
"Penjara","Hufflepuff Hall","Chance","Potion Class","Great Hall",
"Pajak","Astronomy Tower","Chance","Charms Class","Defense Class",
"Azkaban Visit","Herbology","Chance","Quidditch Pitch","Transfiguration",
"Free Parking","Dueling Club","Chance","Headmaster Office",
"Care of Creatures","Pajak","Chamber","Chance","Grand Staircase",
"Final Exam"
];

const special=new Set([0,4,5,10,15,20,25,30,35]);

function playerKey(){
 let k=localStorage.getItem("hogwarts_mono_key");
 if(!k){
  k=crypto.randomUUID();
  localStorage.setItem("hogwarts_mono_key",k);
 }
 return k;
}
function code(){
 return Math.random().toString(36).slice(2,8).toUpperCase();
}
function wait(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}
function message(s){
 $("actionMsg").textContent=s;
}
function log(s){
 const d=document.createElement("div");
 d.textContent=s;
 $("log").prepend(d);
}
function coords(index){
 const n=index%10;
 if(index<10)return{x:92-n*9.3,y:92};
 if(index<20)return{x:8,y:92-n*9.3};
 if(index<30)return{x:8+n*9.3,y:8};
 return{x:92,y:8+n*9.3};
}
function drawDice(value){
 const places={
  1:[4],2:[0,8],3:[0,4,8],
  4:[0,2,6,8],5:[0,2,4,6,8],
  6:[0,2,3,5,6,8]
 }[value]||[];
 $("dice").innerHTML="";
 for(let i=0;i<9;i++){
  const el=document.createElement("i");
  if(places.includes(i))el.className="dot";
  $("dice").appendChild(el);
 }
}
function render(){
 if(!room)return;
 const current=players.find(p=>p.player_index===room.current_player);
 $("turnLabel").textContent=room.status==="waiting"?"Menunggu":
 room.status==="finished"?"Selesai":"Giliran: "+(current?.player_name||"-");

 $("players").innerHTML=players.map((p,i)=>`
 <div class="player ${p.player_index===room.current_player?"active":""}">
  <div class="avatar" style="background:${p.color}"></div>
  <div>
   <b>${escapeHtml(p.player_name)}</b>
   <div class="money">$${p.money}</div>
   <div class="muted">Petak ${p.position+1}</div>
  </div>
 </div>`).join("");

 const allowed=room.status==="playing"&&me&&
 room.current_player===me.player_index&&!moving;

 $("roll").disabled=!allowed||rolled;
 $("buy").disabled=!allowed||!rolled;
 $("upgrade").disabled=!allowed||!rolled;
 $("end").disabled=!allowed||!rolled;
 $("start").disabled=!me||me.player_index!==0||
 room.status!=="waiting";
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}
function draw(){
 document.querySelectorAll(".piece,.building").forEach(x=>x.remove());

 players.forEach((p,i)=>{
  const c=coords(p.position);
  const el=document.createElement("div");
  el.className="piece p"+i;
  el.style.left=c.x+"%";
  el.style.top=c.y+"%";
  el.textContent=i+1;
  el.title=p.player_name;
  $("board").appendChild(el);
 });

 properties.forEach(p=>{
  if(p.owner_index==null)return;
  const c=coords(p.cell_index);
  const el=document.createElement("div");
  el.className="building";
  el.style.left=(c.x+3)+"%";
  el.style.top=(c.y-3)+"%";
  el.textContent=p.level>=4?"🏰":p.level>=2?"🏠":"🏡";
  $("board").appendChild(el);
 });
}
async function refresh(){
 const [r,p,pr]=await Promise.all([
  db.from("monopoly_rooms").select("*").eq("id",room.id).single(),
  db.from("monopoly_players").select("*")
   .eq("room_id",room.id).order("player_index"),
  db.from("monopoly_properties").select("*")
   .eq("room_id",room.id).order("cell_index")
 ]);
 if(r.error)throw r.error;
 room=r.data;players=p.data||[];properties=pr.data||[];
 me=players.find(x=>x.player_key===playerKey())||me;
 render();draw();
}
function subscribe(){
 if(channel)db.removeChannel(channel);
 channel=db.channel("monopoly-"+room.id)
 .on("postgres_changes",{
  event:"*",schema:"public",table:"monopoly_rooms",
  filter:"id=eq."+room.id
 },refresh)
 .on("postgres_changes",{
  event:"*",schema:"public",table:"monopoly_players",
  filter:"room_id=eq."+room.id
 },refresh)
 .on("postgres_changes",{
  event:"*",schema:"public",table:"monopoly_properties",
  filter:"room_id=eq."+room.id
 },refresh)
 .subscribe();
}
async function createRoom(c){
 const {data,error}=await db.from("monopoly_rooms")
 .insert({code:c,status:"waiting"}).select().single();
 if(error)throw error;
 room=data;

 const rows=Array.from({length:TOTAL},(_,i)=>({
  room_id:room.id,cell_index:i,
  price:100+Math.floor(i/4)*20,
  rent:10+Math.floor(i/4)*5
 }));
 const result=await db.from("monopoly_properties").insert(rows);
 if(result.error)throw result.error;
}
async function join(){
 const name=$("name").value.trim();
 let c=$("room").value.trim().toUpperCase();
 if(!name)return $("setupMsg").textContent="Masukkan nama.";

 try{
  $("join").disabled=true;
  $("setupMsg").textContent="Menghubungkan...";

  if(!c){
   c=code();await createRoom(c);
  }else{
   const {data,error}=await db.from("monopoly_rooms")
    .select("*").eq("code",c).maybeSingle();
   if(error)throw error;
   if(!data)throw new Error("Room tidak ditemukan.");
   room=data;
  }

  const {count}=await db.from("monopoly_players")
   .select("*",{count:"exact",head:true}).eq("room_id",room.id);
  if(count>=4)throw new Error("Room penuh.");

  const {data:existing}=await db.from("monopoly_players")
   .select("*").eq("room_id",room.id)
   .eq("player_key",playerKey()).maybeSingle();

  if(existing)me=existing;
  else{
   const {data:p,error}=await db.from("monopoly_players").insert({
    room_id:room.id,player_key:playerKey(),
    player_name:name,color:COLORS[count||0],
    player_index:count||0
   }).select().single();
   if(error)throw error;
   me=p;
  }

  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomLabel").textContent=room.code;
  $("status").textContent="ONLINE";
  await refresh();
  subscribe();
  log("Berhasil masuk room "+room.code);
 }catch(e){
  $("setupMsg").textContent=e.message||"Gagal masuk.";
 }finally{
  $("join").disabled=false;
 }
}
async function start(){
 if(!me||me.player_index!==0)return;
 if(players.length<2)return message("Minimal 2 pemain.");
 await db.from("monopoly_rooms")
  .update({status:"playing"}).eq("id",room.id);
 await refresh();
 log("Permainan dimulai.");
}
function canAct(){
 return !!me&&!!room&&room.status==="playing"&&
 room.current_player===me.player_index&&!moving;
}
async function roll(){
 if(!canAct()||rolled)return;
 moving=true;render();

 const value=Math.floor(Math.random()*6)+1;
 drawDice(value);
 $("diceText").textContent="Hasil: "+value;
 $("dice").classList.add("rolling");
 await wait(450);
 $("dice").classList.remove("rolling");

 const p=players.find(x=>x.id===me.id);
 if(!p){moving=false;return;}

 const start=p.position;
 for(let i=1;i<=value;i++){
  const position=(start+i)%TOTAL;
  p.position=position;
  draw();
  await wait(160);
 }
 rolled=true;
 moving=false;

 const passed=start+value>=TOTAL;
 let money=p.money+(passed?200:0);
 if(passed)log(p.player_name+" melewati Start +$200.");

 await db.from("monopoly_players")
  .update({position:p.position,money}).eq("id",p.id);
 await refresh();

 const prop=properties.find(x=>x.cell_index===p.position);
 if(prop&&prop.owner_index!=null&&prop.owner_index!==p.player_index){
  await payRent(p,prop);
 }
 message("Mendarat di "+propertyNames[p.position]);
 log(p.player_name+" melempar "+value+".");
}
async function payRent(p,prop){
 const owner=players.find(x=>x.player_index===prop.owner_index);
 if(!owner)return;
 const rent=Math.min(prop.rent,p.money);
 await db.from("monopoly_players").update({
  money:p.money-rent
 }).eq("id",p.id);
 await db.from("monopoly_players").update({
  money:owner.money+rent
 }).eq("id",owner.id);
 log(p.player_name+" membayar sewa $"+rent+
 " kepada "+owner.player_name+".");
 await refresh();
}
async function buy(){
 if(!canAct()||!rolled)return;
 const p=players.find(x=>x.id===me.id);
 const prop=properties.find(x=>x.cell_index===p.position);
 if(!prop||prop.owner_index!=null||special.has(p.position))
  return message("Petak ini tidak dapat dibeli.");
 if(p.money<prop.price)return message("Uang tidak cukup.");

 await db.from("monopoly_players").update({
  money:p.money-prop.price
 }).eq("id",p.id);
 await db.from("monopoly_properties").update({
  owner_index:p.player_index,level:0
 }).eq("id",prop.id);
 log(p.player_name+" membeli "+propertyNames[p.position]+".");
 await refresh();
}
async function upgrade(){
 if(!canAct()||!rolled)return;
 const p=players.find(x=>x.id===me.id);
 const prop=properties.find(x=>x.cell_index===p.position);
 if(!prop||prop.owner_index!==p.player_index)
  return message("Kamu bukan pemilik properti.");
 if(prop.level>=4)return message("Bangunan maksimal.");
 if(p.money<prop.price)return message("Uang tidak cukup.");

 await db.from("monopoly_players").update({
  money:p.money-prop.price
 }).eq("id",p.id);
 await db.from("monopoly_properties").update({
  level:prop.level+1,rent:prop.rent*2
 }).eq("id",prop.id);
 log(p.player_name+" meng-upgrade "+propertyNames[p.position]+".");
 await refresh();
}
async function endTurn(){
 if(!canAct()||!rolled)return;
 const next=(room.current_player+1)%players.length;
 await db.from("monopoly_rooms").update({
  current_player:next,turn_number:room.turn_number+1,dice_value:0
 }).eq("id",room.id);
 rolled=false;drawDice(0);
 $("diceText").textContent="Belum dilempar";
 await refresh();
}

$("join").onclick=join;
$("start").onclick=start;
$("roll").onclick=roll;
$("buy").onclick=buy;
$("upgrade").onclick=upgrade;
$("end").onclick=endTurn;
drawDice(0);
</script>
</body>
</html>
