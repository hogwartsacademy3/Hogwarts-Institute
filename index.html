<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hogwarts Institute Monopoly</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden; /* Hindari scroll, paskan ke layar */
        }

        .hogwarts-font {
            font-family: 'Cinzel', serif;
        }

        /* Layout Utama */
        #game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: row;
        }

        @media (max-width: 768px) {
            #game-container {
                flex-direction: column;
                overflow-y: auto;
            }
        }

        /* Area Papan */
        #board-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            padding: 10px;
            position: relative;
        }

        #board-wrapper {
            position: relative;
            width: 100%;
            max-width: 90vh; /* Paskan dengan tinggi layar */
            aspect-ratio: 1 / 1;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            #board-wrapper {
                max-width: 100%;
                width: 95vw;
            }
        }

        #board-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Bidak Pemain */
        .player-piece {
            position: absolute;
            width: 4%;
            height: 4%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: top 0.3s linear, left 0.3s linear;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5vw;
            color: white;
            text-shadow: 1px 1px 2px black;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.8);
        }

        /* Bangunan / Penanda Kepemilikan */
        .building-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 1.2vw;
            text-shadow: 0 0 5px black;
            background: rgba(0,0,0,0.6);
            padding: 2px;
            border-radius: 4px;
        }

        /* Area UI Kanan */
        #ui-area {
            width: 350px;
            background: #1e293b;
            border-left: 2px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        @media (max-width: 768px) {
            #ui-area {
                width: 100%;
                height: 50vh;
                border-left: none;
                border-top: 2px solid #334155;
            }
        }

        /* Animasi Dadu */
        .dice-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .dice.rolling {
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-5deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-5deg); }
            80% { transform: translate(-1px, -1px) rotate(5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-5deg); }
        }

        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #1e293b;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Modal Custom */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <!-- Layar Join / Login -->
    <div id="join-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full text-center border border-slate-700">

    <!-- Modal Beli Properti -->

    <script>
        // Konfigurasi Supabase dari User
        const SUBASE_URL = 'https://wrhxzczvlfmdybuyslcv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_d-AKVoEiwg_2xMPUCeiaLQ_Gnvn3kIe';
        const ROOM_NAME = 'hogwarts-mabar';

        let supabase;
        let channel;
        let isConnected = false;

        // Data Pemain Lokal
        let myId = 'user_' + Math.random().toString(36).substr(2, 9);
        let myColor = '#dc2626'; // Default Merah
        let myName = '';

        // State Game Global (Disinkronkan via Broadcast)
        let gameState = {
            players: {}, // object key: playerId, value: {name, color, pos, money, inJail}
            turnOrder: [], // array of playerIds
            currentTurnIndex: 0,
            properties: {}, // kepemilikan dan level bangunan
            phase: 'waiting', // waiting, rolling, moving, action
            logs: []
        };

        // DOM Elements
        const elJoinScreen = document.getElementById('join-screen');
        const elGameContainer = document.getElementById('game-container');
        const elBtnJoin = document.getElementById('btn-join');
        const elPlayerName = document.getElementById('player-name');
        const elConnStatus = document.getElementById('connection-status');
        const elColorPicks = document.querySelectorAll('.color-pick');
        
        const elBoardImg = document.getElementById('board-img');
        const elPiecesLayer = document.getElementById('pieces-layer');
        const elBuildingsLayer = document.getElementById('buildings-layer');
        const elPlayersList = document.getElementById('players-list');
        const elGameLog = document.getElementById('game-log');
        const elTurnIndicator = document.getElementById('turn-indicator');
        
        const btnRoll = document.getElementById('action-roll');
        const btnEnd = document.getElementById('action-end');

        // Modal Elements
        const modProp = document.getElementById('modal-property');
        const modMsg = document.getElementById('modal-message');

        /* 
           Berdasarkan gambar, papan ini memiliki 39 petak (bukan 40 standar).
           Sisi Bawah: 9, Kiri: 9, Atas: 9, Kanan: 8. Total + 4 Sudut = 39.
        */
        const BOARD_SPACES = [
            { id: 0, name: "GO", type: "go", price: 0 },
            // Bawah (1-9)
            { id: 1, name: "Divination Classroom", type: "property", price: 50, color: "#8B4513" }, // Brown
            { id: 2, name: "Herbology Classroom", type: "property", price: 50, color: "#8B4513" },
            { id: 3, name: "Care of Magical Creatures", type: "property", price: 60, color: "#8B4513" },
            { id: 4, name: "The Three Broomsticks", type: "property", price: 60, color: "#87CEEB" }, // Light blue
            { id: 5, name: "Community Chest", type: "chest", price: 0 },
            { id: 6, name: "Quidditch Pitch", type: "property", price: 80, color: "#87CEEB" },
            { id: 7, name: "Flight Class", type: "property", price: 80, color: "#87CEEB" },
            { id: 8, name: "Prefects' Bathroom", type: "property", price: 100, color: "#D8BFD8" }, // Pink
            { id: 9, name: "DADA Classroom", type: "property", price: 100, color: "#D8BFD8" },
            // Sudut Kiri Bawah
            { id: 10, name: "Just Visiting", type: "jail", price: 0 },
            // Kiri (11-19)
            { id: 11, name: "School Shop", type: "property", price: 50, color: "#D8BFD8" },
            { id: 12, name: "St. Mungo's", type: "property", price: 60, color: "#FFA500" }, // Orange
            { id: 13, name: "The Leaky Cauldron", type: "property", price: 80, color: "#FFA500" },
            { id: 14, name: "Chance", type: "chance", price: 0 },
            { id: 15, name: "Diagon Alley", type: "property", price: 100, color: "#FFA500" },
            { id: 16, name: "Knockturn Alley", type: "property", price: 120, color: "#FF0000" }, // Red
            { id: 17, name: "Community Chest", type: "chest", price: 0 },
            { id: 18, name: "Ministry of Magic", type: "property", price: 140, color: "#FF0000" },
            { id: 19, name: "Gringotts", type: "property", price: 150, color: "#FF0000" },
            // Sudut Kiri Atas
            { id: 20, name: "Free Parking", type: "parking", price: 0 },
            // Atas (21-29)
            { id: 21, name: "Hogwarts Express", type: "property", price: 200, color: "#FFFF00" }, // Yellow
            { id: 22, name: "Hogsmeade", type: "property", price: 60, color: "#FFFF00" },
            { id: 23, name: "Hagrid's Hut", type: "property", price: 60, color: "#FFFF00" },
            { id: 24, name: "Forbidden Forest", type: "property", price: 100, color: "#008000" }, // Green
            { id: 25, name: "Charms Classroom", type: "property", price: 100, color: "#008000" },
            { id: 26, name: "Community Chest", type: "chest", price: 0 },
            { id: 27, name: "Transfiguration", type: "property", price: 120, color: "#008000" },
            { id: 28, name: "Potions", type: "property", price: 140, color: "#00008B" }, // Dark Blue
            { id: 29, name: "The Great Hall", type: "property", price: 160, color: "#00008B" },
            // Sudut Kanan Atas
            { id: 30, name: "Go to Azkaban", type: "go_jail", price: 0 },
            // Kanan (31-38) - Berdasarkan visual gambar
            { id: 31, name: "Gryffindor Tower", type: "property", price: 180, color: "#FF0000" },
            { id: 32, name: "Ravenclaw Tower", type: "property", price: 180, color: "#008000" },
            { id: 33, name: "Hufflepuff Tower", type: "property", price: 160, color: "#008000" },
            { id: 34, name: "Slytherin Tower", type: "property", price: 140, color: "#008000" },
            { id: 35, name: "Chance", type: "chance", price: 0 },
            { id: 36, name: "Library", type: "property", price: 140, color: "#0000FF" },
            { id: 37, name: "Astronomy Tower", type: "property", price: 120, color: "#0000FF" },
            { id: 38, name: "Defence Against the Dark Arts", type: "property", price: 100, color: "#0000FF" }
        ];
        const TOTAL_SPACES = 39;

        // Menghitung posisi X, Y (persen) untuk penempatan presisi di atas gambar
        function getBoardCoords(index) {
            const w_corner = 13.5; // Lebar sudut dalam %
            const w_edge_x = 8.11; // 9 petak horizontal
            const w_edge_y_left = 8.11; // 9 petak vertikal kiri
            const w_edge_y_right = 9.125; // 8 petak vertikal kanan (lebih tinggi sedikit)

            // GO
            if (index === 0) return { x: 100 - w_corner/2, y: 100 - w_corner/2 }; 
            // Bawah
            if (index >= 1 && index <= 9) {
                return { x: 100 - w_corner - (index - 0.5) * w_edge_x, y: 100 - w_corner/2 };
            }
            // Jail
            if (index === 10) return { x: w_corner/2, y: 100 - w_corner/2 };
            // Kiri
            if (index >= 11 && index <= 19) {
                return { x: w_corner/2, y: 100 - w_corner - (index - 10.5) * w_edge_y_left };
            }
            // Parking
            if (index === 20) return { x: w_corner/2, y: w_corner/2 };
            // Atas
            if (index >= 21 && index <= 29) {
                return { x: w_corner + (index - 20.5) * w_edge_x, y: w_corner/2 };
            }
            // Azkaban
            if (index === 30) return { x: 100 - w_corner/2, y: w_corner/2 };
            // Kanan
            if (index >= 31 && index <= 38) {
                return { x: 100 - w_corner/2, y: w_corner + (index - 30.5) * w_edge_y_right };
            }
            return { x: 50, y: 50 }; // Fallback
        }

        async function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUBASE_URL, SUPABASE_KEY);
                
                channel = supabase.channel(ROOM_NAME, {
                    config: {
                        presence: { key: myId },
                        broadcast: { self: true }
                    }
                });

                // Listeners
                channel.on('presence', { event: 'sync' }, handlePresenceSync);
                channel.on('presence', { event: 'join' }, handlePresenceJoin);
                channel.on('presence', { event: 'leave' }, handlePresenceLeave);
                
                channel.on('broadcast', { event: 'STATE_UPDATE' }, payload => syncState(payload.state));
                channel.on('broadcast', { event: 'DICE_ROLL' }, payload => animateDiceAndMove(payload));
                channel.on('broadcast', { event: 'LOG' }, payload => addLog(payload.msg));

                const status = await channel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        isConnected = true;
                        elConnStatus.textContent = "Terhubung! Siap bermain.";
                        elConnStatus.className = "text-sm mb-4 text-green-400 font-bold";
                        elBtnJoin.disabled = false;
                        await channel.track({ id: myId, name: myName, color: myColor });
                    }
                });
            } catch (err) {
                elConnStatus.textContent = "Gagal terhubung ke server.";
                elConnStatus.className = "text-sm mb-4 text-red-500";
                console.error("Supabase Error:", err);
            }
        }

        let hostId = null; // Pemain tertua di room yang handle state awal

        function handlePresenceSync() {
            const state = channel.presenceState();
            const onlineIds = Object.keys(state);
            
            if (onlineIds.length > 0) {
                // Tentukan host (ID pertama berdasar sort alfabetis agar konsisten)
                onlineIds.sort();
                hostId = onlineIds[0];
                
                // Jika saya host dan game belum mulai, inisialisasi
                if (myId === hostId && Object.keys(gameState.players).length === 0) {
                    gameState.phase = 'rolling';
                }
            }
            renderPlayersUI();
        }

        function handlePresenceJoin({ newPresences }) {
            newPresences.forEach(p => {
                if (!gameState.players[p.id]) {
                    gameState.players[p.id] = {
                        id: p.id,
                        name: p.name,
                        color: p.color,
                        pos: 0,
                        money: 1500,
                        inJail: false
                    };
                    if (!gameState.turnOrder.includes(p.id)) {
                        gameState.turnOrder.push(p.id);
                    }
                    if (myId === hostId) {
                        broadcastState();
                        broadcastLog(`${p.name} bergabung ke permainan.`);
                    }
                }
            });
            renderPlayersUI();
        }

        function handlePresenceLeave({ leftPresences }) {
            leftPresences.forEach(p => {
                broadcastLog(`${gameState.players[p.id]?.name || 'Seseorang'} keluar.`);
                // Jangan hapus data, biarkan saja offline
            });
        }

        function broadcastState() {
            if (!isConnected) return;
            channel.send({
                type: 'broadcast',
                event: 'STATE_UPDATE',
                state: gameState
            });
            syncState(gameState); // Update lokal
        }

        function broadcastLog(msg) {
            channel.send({ type: 'broadcast', event: 'LOG', msg });
            addLog(msg);
        }

        function syncState(newState) {
            gameState = newState;
            renderPlayersUI();
            renderBoard();
            updateTurnUI();
        }

        function renderBoard() {
            elPiecesLayer.innerHTML = '';
            elBuildingsLayer.innerHTML = '';

            // Render Bidak
            Object.values(gameState.players).forEach(p => {
                const coords = getBoardCoords(p.pos);
                const piece = document.createElement('div');
                piece.className = 'player-piece';
                piece.style.backgroundColor = p.color;
                piece.style.left = coords.x + '%';
                piece.style.top = coords.y + '%';
                
                // Jika ada pemain di kotak yang sama, geser sedikit agar tidak numpuk
                let offsetCount = Object.values(gameState.players).filter(op => op.pos === p.pos).indexOf(p);
                if (offsetCount > 0) {
                    piece.style.transform = `translate(calc(-50% + ${offsetCount * 10}px), calc(-50% + ${offsetCount * 10}px))`;
                }

                piece.innerHTML = `<i class="fa-solid fa-hat-wizard"></i>`; // Icon wizard
                elPiecesLayer.appendChild(piece);
            });

            // Render Bangunan / Kepemilikan (Objek 2D sesuai permintaan)
            Object.keys(gameState.properties).forEach(propId => {
                const prop = gameState.properties[propId];
                if (prop.owner) {
                    const ownerData = gameState.players[prop.owner];
                    const coords = getBoardCoords(parseInt(propId));
                    const marker = document.createElement('div');
                    marker.className = 'building-marker';
                    // Posisikan sedikit di atas tengah petak
                    marker.style.left = coords.x + '%';
                    marker.style.top = `calc(${coords.y}% - 3%)`;
                    marker.style.color = ownerData.color;
                    marker.style.border = `1px solid ${ownerData.color}`;
                    
                    let housesHTML = '';
                    for(let i=0; i < (prop.houses || 1); i++) {
                         housesHTML += `<i class="fa-solid fa-house-chimney"></i> `;
                    }
                    marker.innerHTML = housesHTML;
                    elBuildingsLayer.appendChild(marker);
                }
            });
        }

        function renderPlayersUI() {
            elPlayersList.innerHTML = '';
            gameState.turnOrder.forEach(pId => {
                const p = gameState.players[pId];
                if (!p) return;
                
                const isMyTurn = (gameState.turnOrder[gameState.currentTurnIndex] === pId);
                const borderClass = isMyTurn ? 'border-yellow-400 ring-2 ring-yellow-400' : 'border-slate-700';
                
                elPlayersList.innerHTML += `
                    <div class="flex items-center gap-3 bg-slate-800 p-2 rounded border ${borderClass}">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white" style="background:${p.color}">
                            <i class="fa-solid fa-hat-wizard"></i>
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-sm ${pId === myId ? 'text-blue-300' : 'text-slate-200'}">
                                ${p.name} ${pId === myId ? '(Kamu)' : ''}
                            </div>
                            <div class="text-xs text-yellow-400 font-mono">£${p.money}</div>
                        </div>
                    </div>
                `;
            });
        }

        function drawDiceFace(el, value) {
            el.innerHTML = '';
            const dots = {
                1: [[50,50]],
                2: [[25,25], [75,75]],
                3: [[25,25], [50,50], [75,75]],
                4: [[25,25], [25,75], [75,25], [75,75]],
                5: [[25,25], [25,75], [50,50], [75,25], [75,75]],
                6: [[25,25], [25,50], [25,75], [75,25], [75,50], [75,75]]
            };
            (dots[value] || dots[1]).forEach(pos => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.left = pos[0] + '%';
                dot.style.top = pos[1] + '%';
                el.appendChild(dot);
            });
        }

        function addLog(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            elGameLog.appendChild(div);
            elGameLog.scrollTop = elGameLog.scrollHeight;
        }

        function updateTurnUI() {
            if(gameState.turnOrder.length === 0) return;
            const currentTurnId = gameState.turnOrder[gameState.currentTurnIndex];
            const isMyTurn = currentTurnId === myId;
            
            elTurnIndicator.textContent = isMyTurn ? "Giliranmu!" : `Giliran ${gameState.players[currentTurnId]?.name}`;
            elTurnIndicator.className = isMyTurn ? "text-xl font-bold text-green-400 mb-2" : "text-xl font-bold text-yellow-400 mb-2";

            btnRoll.classList.add('hidden');
            btnEnd.classList.add('hidden');

            if (isMyTurn) {
                if (gameState.phase === 'rolling') btnRoll.classList.remove('hidden');
                if (gameState.phase === 'action') btnEnd.classList.remove('hidden');
            }
        }

        btnRoll.addEventListener('click', () => {
            if (gameState.phase !== 'rolling') return;
            gameState.phase = 'moving';
            btnRoll.classList.add('hidden');
            
            // Dadu visual random
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            
            channel.send({
                type: 'broadcast',
                event: 'DICE_ROLL',
                playerId: myId,
                d1: d1,
                d2: d2
            });
            
            animateDiceAndMove({playerId: myId, d1, d2});
        });

        // Animasi pergerakan bidak 1 per 1 agar tidak lompat (Tepat di atas petak)
        async function animateDiceAndMove(data) {
            const {playerId, d1, d2} = data;
            const player = gameState.players[playerId];
            const steps = d1 + d2;
            
            // Animasi dadu kocok
            const diceEl1 = document.getElementById('dice1');
            const diceEl2 = document.getElementById('dice2');
            diceEl1.classList.add('rolling');
            diceEl2.classList.add('rolling');
            
            broadcastLog(`${player.name} melempar dadu...`);

            // Fake roll effect
            for(let i=0; i<10; i++) {
                drawDiceFace(diceEl1, Math.floor(Math.random()*6)+1);
                drawDiceFace(diceEl2, Math.floor(Math.random()*6)+1);
                await new Promise(r => setTimeout(r, 50));
            }
            
            diceEl1.classList.remove('rolling');
            diceEl2.classList.remove('rolling');
            drawDiceFace(diceEl1, d1);
            drawDiceFace(diceEl2, d2);
            
            broadcastLog(`${player.name} mendapat angka ${steps} (${d1} + ${d2}).`);

            await new Promise(r => setTimeout(r, 500)); // Pause sejenak

            // Animasi jalan step by step
            let currentPos = player.pos;
            for (let i = 0; i < steps; i++) {
                currentPos = (currentPos + 1) % TOTAL_SPACES;
                player.pos = currentPos;
                renderBoard(); // Trigger CSS transition posisi baru
                
                // Lewat GO
                if (currentPos === 0 && playerId === myId) {
                    player.money += 200;
                    broadcastLog(`${player.name} melewati GO, menerima £200.`);
                }
                
                await new Promise(r => setTimeout(r, 350)); // Tunggu transisi selesai sebelum langkah berikutnya
            }

            if (playerId === myId) {
                handleSpaceLanding(player);
            }
        }

        function handleSpaceLanding(player) {
            const space = BOARD_SPACES[player.pos];
            broadcastLog(`${player.name} mendarat di ${space.name}.`);

            if (space.type === 'property') {
                const propState = gameState.properties[player.pos];
                
                if (!propState || !propState.owner) {
                    // Properti kosong, tawarkan beli
                    if (player.money >= space.price) {
                        showBuyModal(space, player);
                    } else {
                        broadcastLog(`${player.name} tidak cukup uang untuk membeli ${space.name}.`);
                        endTurnPhase();
                    }
                } else if (propState.owner !== player.id) {
                    // Bayar Sewa (Standar sederhana: 10% dari harga, jika ada rumah x2)
                    let rent = Math.floor(space.price * 0.1);
                    if (propState.houses > 1) rent = rent * propState.houses;
                    
                    const owner = gameState.players[propState.owner];
                    player.money -= rent;
                    owner.money += rent;
                    
                    broadcastLog(`${player.name} membayar sewa £${rent} kepada ${owner.name}.`);
                    showMessage("Bayar Sewa", `Anda mendarat di properti milik ${owner.name} dan harus membayar £${rent}.`, endTurnPhase);
                } else {
                    // Milik sendiri, tawarkan upgrade? (Opsional, skip untuk kesederhanaan, langsung end turn)
                    broadcastLog(`${player.name} mendarat di propertinya sendiri.`);
                    endTurnPhase();
                }
            } 
            else if (space.type === 'chance' || space.type === 'chest') {
                // Kartu random sederhana
                const rewards = [50, 100, -50, -20];
                const texts = ["Menemukan dompet", "Menang Quidditch", "Denda Kementerian", "Membeli ramuan"];
                const pick = Math.floor(Math.random() * rewards.length);
                const amount = rewards[pick];
                player.money += amount;
                
                const verb = amount > 0 ? "mendapat" : "membayar";
                broadcastLog(`${player.name} mengambil kartu: ${texts[pick]}, ${verb} £${Math.abs(amount)}.`);
                showMessage("Kartu Magic", `${texts[pick]}. Anda ${verb} £${Math.abs(amount)}.`, endTurnPhase);
            }
            else if (space.type === 'go_jail') {
                player.pos = 10; // Masuk penjara
                player.inJail = true;
                broadcastLog(`${player.name} tertangkap dan dikirim ke Azkaban!`);
                showMessage("Azkaban!", "Anda dikirim ke Azkaban.", endTurnPhase);
            }
            else {
                // Parking, Jail visit, Go
                endTurnPhase();
            }
        }

        // Fungsi Modals
        function showBuyModal(space, player) {
            document.getElementById('modal-prop-name').textContent = space.name;
            document.getElementById('modal-prop-price').textContent = `Harga: £${space.price}`;
            modProp.classList.add('active');

            const onBuy = () => {
                player.money -= space.price;
                gameState.properties[player.pos] = { owner: player.id, houses: 1 };
                broadcastLog(`${player.name} membeli ${space.name} seharga £${space.price}!`);
                closeModal();
                endTurnPhase();
            };
            const onPass = () => {
                broadcastLog(`${player.name} memutuskan tidak membeli ${space.name}.`);
                closeModal();
                endTurnPhase();
            };

            document.getElementById('btn-buy').onclick = onBuy;
            document.getElementById('btn-pass').onclick = onPass;
        }

        function showMessage(title, text, callback) {
            document.getElementById('modal-msg-title').textContent = title;
            document.getElementById('modal-msg-text').textContent = text;
            modMsg.classList.add('active');
            document.getElementById('btn-msg-ok').onclick = () => {
                modMsg.classList.remove('active');
                if (callback) callback();
            };
        }

        function closeModal() {
            modProp.classList.remove('active');
            modMsg.classList.remove('active');
        }

        function endTurnPhase() {
            gameState.phase = 'action';
            broadcastState(); // Sync state setelah semua action selesai
        }

        btnEnd.addEventListener('click', () => {
            if (gameState.phase !== 'action') return;
            
            // Pindah giliran
            gameState.currentTurnIndex = (gameState.currentTurnIndex + 1) % gameState.turnOrder.length;
            gameState.phase = 'rolling';
            
            broadcastState();
        });


        // UI Selection
        elColorPicks.forEach(btn => {
            btn.addEventListener('click', (e) => {
                elColorPicks.forEach(b => {
                    b.classList.remove('ring-2', 'ring-white');
                    b.classList.add('border-transparent');
                });
                e.target.classList.add('ring-2', 'ring-white');
                e.target.classList.remove('border-transparent');
                myColor = e.target.dataset.color;
            });
        });

        elBtnJoin.addEventListener('click', () => {
            const name = elPlayerName.value.trim();
            if (!name) {
                alert("Silakan masukkan nama Anda!");
                return;
            }
            myName = name;
            
            // Hide menu, show game
            elJoinScreen.style.display = 'none';
            elGameContainer.style.display = 'flex';
            
            // Init Supabase
            initSupabase();

            // Set dadu awal default
            drawDiceFace(document.getElementById('dice1'), 1);
            drawDiceFace(document.getElementById('dice2'), 1);
        });

        // Auto-disable tombol join sampai supabase siap
        elBtnJoin.disabled = true;

        // Resize handler untuk memastikan papan tetap proporsional
        window.addEventListener('resize', renderBoard);

    </script>
</body>
</html>
