    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
            user-select: none;
        }

        .hogwarts-font {
            font-family: 'Cinzel', serif;
        }

        /* Layout Utama Responsive */
        #game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: row;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
        }

        @media (max-width: 1024px) {
            #game-container {
                flex-direction: column;
                overflow-y: auto;
            }
        }

        /* Area Papan Game */
        #board-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            height: 100%;
        }

        #board-wrapper {
            position: relative;
            width: 100%;
            max-width: 92vh;
            aspect-ratio: 1 / 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(234, 179, 8, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #334155;
            background: #020617;
        }

        @media (max-width: 1024px) {
            #board-wrapper {
                max-width: 100%;
                width: 96vw;
            }
        }

        #board-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Bidak Pemain Visual */
        .player-piece {
            position: absolute;
            width: 4.2%;
            height: 4.2%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1vw;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.6);
            border: 2px solid rgba(255,255,255,0.9);
        }

        @media (max-width: 768px) {
            .player-piece {
                font-size: 3vw;
            }
        }

        /* Marker Bangunan / Pemilik Properti 2D */
        .building-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
            font-size: 0.85vw;
            font-weight: bold;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 2px 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none;
            transition: all 0.2s ease-in-out;
        }

        @media (max-width: 768px) {
            .building-marker {
                font-size: 2vw;
            }
        }

        /* Panel UI Samping */
        #ui-area {
            width: 380px;
            background: rgba(15, 23, 42, 0.95);
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 1024px) {
            #ui-area {
                width: 100%;
                height: auto;
                min-height: 50vh;
                border-left: none;
                border-top: 2px solid #334155;
            }
        }

        /* Desain Dadu 3D dengan Titik (Dots) */
        .dice-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0;
        }

        .dice {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 8px 15px rgba(0,0,0,0.4);
            border: 2px solid #cbd5e1;
        }

        .dice.rolling {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-6deg); }
            40% { transform: translate(-2px, 2px) rotate(6deg); }
            60% { transform: translate(3px, 1px) rotate(-3deg); }
            80% { transform: translate(-1px, -2px) rotate(3deg); }
            100% { transform: translate(2px, -1px) rotate(0deg); }
        }

        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #0f172a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 2px 2px rgba(0,0,0,0.6);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>

        // Kalkulasi Persentase Koordinat Presisi untuk Gambar Papan Monopoly
        function getBoardCoords(index) {
            const w_corner = 13.5;
            const w_edge_x = 8.11;
            const w_edge_y_left = 8.11;
            const w_edge_y_right = 9.125;

            if (index === 0) return { x: 100 - w_corner/2, y: 100 - w_corner/2 }; 
            if (index >= 1 && index <= 9) return { x: 100 - w_corner - (index - 0.5) * w_edge_x, y: 100 - w_corner/2 };
            if (index === 10) return { x: w_corner/2, y: 100 - w_corner/2 };
            if (index >= 11 && index <= 19) return { x: w_corner/2, y: 100 - w_corner - (index - 10.5) * w_edge_y_left };
            if (index === 20) return { x: w_corner/2, y: w_corner/2 };
            if (index >= 21 && index <= 29) return { x: w_corner + (index - 20.5) * w_edge_x, y: w_corner/2 };
            if (index === 30) return { x: 100 - w_corner/2, y: w_corner/2 };
            if (index >= 31 && index <= 38) return { x: 100 - w_corner/2, y: w_corner + (index - 30.5) * w_edge_y_right };
            return { x: 50, y: 50 };
        }

        async function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // Ambil state room terbaru dari SQL Database
                const { data, error } = await supabase
                    .from('monopoly_room')
                    .select('game_state')
                    .eq('room_id', ROOM_ID)
                    .single();

                if (data && data.game_state) {
                    gameState = data.game_state;
                } else {
                    // Jika room baru, reset state ke default
                    gameState = {
                        players: {},
                        turnOrder: [],
                        currentTurnIndex: 0,
                        properties: {},
                        phase: 'waiting',
                        logs: []
                    };
                }

                // Tambahkan pemain jika belum terdaftar di room
                if (!gameState.players[myId]) {
                    gameState.players[myId] = { id: myId, name: myName, color: myColor, pos: 0, money: 1500, inJail: false };
                    if (!gameState.turnOrder.includes(myId)) {
                        gameState.turnOrder.push(myId);
                    }
                    if (gameState.phase === 'waiting' && gameState.turnOrder.length > 0) {
                        gameState.phase = 'rolling';
                    }
                    pushLog(`${myName} masuk ke dalam Hogwarts Institute.`);
                    await saveStateToDB();
                } else {
                    gameState.players[myId].name = myName;
                    gameState.players[myId].color = myColor;
                    await saveStateToDB();
                    syncState(gameState); 
                }

                // Realtime subscription ke tabel SQL `monopoly_room`
                supabase.channel('db-changes-' + ROOM_ID)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'monopoly_room', filter: `room_id=eq.${ROOM_ID}` }, payload => {
                        if (!isAnimating && payload.new && payload.new.game_state) {
                            syncState(payload.new.game_state);
                        }
                    })
                    .subscribe();

                // Broadcast Channel untuk Animasi Dadu Realtime bersama
                channel = supabase.channel('room-events-' + ROOM_ID);
                channel.on('broadcast', { event: 'DICE_ROLL' }, payload => {
                    animateDiceAndMove(payload.payload);
                }).subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        elJoinScreen.style.display = 'none';
                        elGameContainer.style.display = 'flex';
                        renderBoard();
                    }
                });

            } catch (err) {
                elConnStatus.classList.remove('hidden');
                elConnStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1 text-rose-400"></i> Gagal koneksi DB. Pastikan Script SQL sudah di-RUN!';
                elConnStatus.className = "text-xs mb-5 p-2.5 rounded-lg bg-rose-950/80 text-rose-400 font-mono border border-rose-700/60";
                console.error("Supabase Error:", err);
                
                elBtnJoin.disabled = false;
                elBtnJoin.innerHTML = 'Coba Lagi';
            }
        }

        async function saveStateToDB() {
            await supabase.from('monopoly_room').upsert({
                room_id: ROOM_ID,
                game_state: gameState
            });
            syncState(gameState);
        }

        function pushLog(msg) {
            gameState.logs.push(msg);
            if (gameState.logs.length > 60) gameState.logs.shift();
        }

        function syncState(newState) {
            gameState = newState;
            renderPlayersUI();
            renderBoard();
            updateTurnUI();
            renderLogs();
        }

        function renderLogs() {
            elGameLog.innerHTML = '';
            gameState.logs.forEach(msg => {
                const div = document.createElement('div');
                div.className = "border-l-2 border-yellow-500/50 pl-2 py-0.5 text-slate-300";
                div.textContent = msg;
                elGameLog.appendChild(div);
            });
            elGameLog.scrollTop = elGameLog.scrollHeight;
        }

        function renderBoard() {
            elPiecesLayer.innerHTML = '';
            elBuildingsLayer.innerHTML = '';

            // Render Bidak Pemain
            Object.values(gameState.players).forEach(p => {
                const coords = getBoardCoords(p.pos);
                const piece = document.createElement('div');
                piece.className = 'player-piece';
                piece.style.backgroundColor = p.color;
                piece.style.left = coords.x + '%';
                piece.style.top = coords.y + '%';
                
                // Mencegah penumpukan jika multiple player berada di petak yang sama
                let samePosPlayers = Object.values(gameState.players).filter(op => op.pos === p.pos);
                let offsetIndex = samePosPlayers.indexOf(p);
                if (offsetIndex > 0) {
                    const angle = (offsetIndex / samePosPlayers.length) * 2 * Math.PI;
                    const radius = 12; // offset pixel
                    const offsetX = Math.cos(angle) * radius;
                    const offsetY = Math.sin(angle) * radius;
                    piece.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                }

                piece.innerHTML = `<i class="fa-solid fa-hat-wizard"></i>`;
                elPiecesLayer.appendChild(piece);
            });

            // Render Marker Kepemilikan & Rumah 2D
            Object.keys(gameState.properties).forEach(propId => {
                const prop = gameState.properties[propId];
                if (prop && prop.owner) {
                    const ownerData = gameState.players[prop.owner];
                    if (!ownerData) return;
                    
                    const coords = getBoardCoords(parseInt(propId));
                    const marker = document.createElement('div');
                    marker.className = 'building-marker';
                    marker.style.left = coords.x + '%';
                    marker.style.top = `calc(${coords.y}% - 3.2%)`;
                    marker.style.color = ownerData.color;
                    marker.style.borderColor = ownerData.color;
                    
                    let housesHTML = `<i class="fa-solid fa-crown text-yellow-400 mr-1"></i>`;
                    for(let i = 0; i < (prop.houses || 1); i++) {
                         housesHTML += `<i class="fa-solid fa-house-chimney"></i>`;
                    }
                    marker.innerHTML = housesHTML;
                    elBuildingsLayer.appendChild(marker);
                }
            });
        }

        function renderPlayersUI() {
            elPlayersList.innerHTML = '';
            gameState.turnOrder.forEach(pId => {
                const p = gameState.players[pId];
                if (!p) return;
                
                const isMyTurn = (gameState.turnOrder[gameState.currentTurnIndex] === pId);
                const borderClass = isMyTurn ? 'border-yellow-500 ring-2 ring-yellow-500/40 bg-slate-800' : 'border-slate-800 bg-slate-900/60';
                
                elPlayersList.innerHTML += `
                    <div class="flex items-center gap-3 p-3 rounded-xl border ${borderClass} transition">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white shadow-md font-bold" style="background:${p.color}">
                            <i class="fa-solid fa-hat-wizard text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-sm flex items-center gap-1.5 ${pId === myId ? 'text-yellow-400' : 'text-slate-200'}">
                                <span>${p.name}</span>
                                ${pId === myId ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">Kamu</span>' : ''}
                            </div>
                            <div class="text-xs text-emerald-400 font-mono font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-coins text-amber-400 text-[10px]"></i> £${p.money}
                            </div>
                        </div>
                        ${isMyTurn ? '<span class="flex h-2.5 w-2.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span></span>' : ''}
                    </div>
                `;
            });
        }

        function drawDiceFace(el, value) {
            el.innerHTML = '';
            const dotsMap = {
                1: [[50,50]],
                2: [[25,25], [75,75]],
                3: [[25,25], [50,50], [75,75]],
                4: [[25,25], [25,75], [75,25], [75,75]],
                5: [[25,25], [25,75], [50,50], [75,25], [75,75]],
                6: [[25,25], [25,50], [25,75], [75,25], [75,50], [75,75]]
            };
            (dotsMap[value] || dotsMap[1]).forEach(pos => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.left = pos[0] + '%';
                dot.style.top = pos[1] + '%';
                el.appendChild(dot);
            });
        }

        function updateTurnUI() {
            if(gameState.turnOrder.length === 0) return;
            const currentTurnId = gameState.turnOrder[gameState.currentTurnIndex];
            const isMyTurn = (currentTurnId === myId);
            
            const activePlayerName = gameState.players[currentTurnId]?.name || 'Pemain';
            elTurnIndicator.textContent = isMyTurn ? "Giliranmu Bermain!" : `Giliran ${activePlayerName}`;
            elTurnIndicator.className = isMyTurn ? "text-xl font-bold text-emerald-400 mb-3 hogwarts-font" : "text-xl font-bold text-yellow-400 mb-3 hogwarts-font";

            btnRoll.classList.add('hidden');
            btnEnd.classList.add('hidden');

            if (isMyTurn) {
                if (gameState.phase === 'rolling') btnRoll.classList.remove('hidden');
                if (gameState.phase === 'action') btnEnd.classList.remove('hidden');
            }
        }

        btnRoll.addEventListener('click', async () => {
            if (gameState.phase !== 'rolling') return;
            gameState.phase = 'moving';
            btnRoll.classList.add('hidden');
            
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            
            // Broadcast animasi kocok dadu ke seluruh pemain
            channel.send({
                type: 'broadcast',
                event: 'DICE_ROLL',
                payload: { playerId: myId, d1: d1, d2: d2 }
            });
            
            // Jalankan animasi di layar sendiri
            animateDiceAndMove({ playerId: myId, d1, d2 });
        });

        async function animateDiceAndMove(data) {
            isAnimating = true;
            const { playerId, d1, d2 } = data;
            const player = gameState.players[playerId];
            if (!player) return;

            const steps = d1 + d2;
            const diceEl1 = document.getElementById('dice1');
            const diceEl2 = document.getElementById('dice2');
            
            diceEl1.classList.add('rolling');
            diceEl2.classList.add('rolling');
            
            // Animasi visual dadu acak
            for(let i=0; i<12; i++) {
                drawDiceFace(diceEl1, Math.floor(Math.random()*6)+1);
                drawDiceFace(diceEl2, Math.floor(Math.random()*6)+1);
                await new Promise(r => setTimeout(r, 40));
            }
            
            diceEl1.classList.remove('rolling');
            diceEl2.classList.remove('rolling');
            drawDiceFace(diceEl1, d1);
            drawDiceFace(diceEl2, d2);
            
            await new Promise(r => setTimeout(r, 400));

            // Animasi Bidak Berjalan Step-by-Step (Mencegah Bidak Loncat)
            let currentPos = player.pos;
            for (let i = 0; i < steps; i++) {
                currentPos = (currentPos + 1) % TOTAL_SPACES;
                player.pos = currentPos;
                renderBoard();
                
                // Bonus Lewat GO (£200)
                if (currentPos === 0 && playerId === myId) {
                    player.money += 200;
                    pushLog(`${player.name} melewati GO dan menerima bonus £200.`);
                }
                await new Promise(r => setTimeout(r, 320));
            }

            isAnimating = false;

            // Pemroses Logika Landed Space khusus untuk player aktif
            if (playerId === myId) {
                pushLog(`${player.name} melempar dadu [${d1} + ${d2} = ${steps}] & mendarat di ${BOARD_SPACES[player.pos].name}.`);
                handleSpaceLanding(player);
            }
        }

        async function handleSpaceLanding(player) {
            const space = BOARD_SPACES[player.pos];

            if (space.type === 'property') {
                const propState = gameState.properties[player.pos];
                
                if (!propState || !propState.owner) {
                    // Properti belum dimiliki -> Tawarkan beli
                    if (player.money >= space.price) {
                        showBuyModal(space, player);
                    } else {
                        pushLog(`${player.name} mendarat di ${space.name} tetapi uang tidak cukup (£${player.money} / £${space.price}).`);
                        await endTurnPhase();
                    }
                } else if (propState.owner !== player.id) {
                    // Bayar sewa ke pemilik properti
                    let rent = Math.floor(space.price * 0.15);
                    if (propState.houses > 1) rent = rent * (propState.houses * 1.5);
                    
                    const owner = gameState.players[propState.owner];
                    player.money -= rent;
                    if (owner) owner.money += rent;
                    
                    pushLog(`${player.name} membayar sewa £${rent} kepada ${owner ? owner.name : 'Pemilik'}.`);
                    showMessage("Bayar Sewa", `Anda mendarat di properti milik ${owner ? owner.name : 'Pemain lain'} dan membayar sewa sebesar £${rent}.`, endTurnPhase);
                } else {
                    // Properti sendiri -> Upgrade/Tambah Rumah 2D
                    if (player.money >= Math.floor(space.price * 0.5) && (propState.houses || 1) < 4) {
                        propState.houses = (propState.houses || 1) + 1;
                        player.money -= Math.floor(space.price * 0.5);
                        pushLog(`${player.name} meng-upgrade bangunan di ${space.name}.`);
                        showMessage("Upgrade Bangunan", `Anda menambahkan bangunan baru di ${space.name}!`, endTurnPhase);
                    } else {
                        pushLog(`${player.name} mengunjungi properti milik sendiri.`);
                        await endTurnPhase();
                    }
                }
            } 
            else if (space.type === 'chance' || space.type === 'chest') {
                const cards = [
                    { title: "Galeon Ditemukan", text: "Menemukan kantong Galeon di Koridor Hogwarts.", amount: 100 },
                    { title: "Menang Taruhan Quidditch", text: "Tim Gryffindor menang pertandingan!", amount: 150 },
                    { title: "Denda Kementerian Sihir", text: "Menggunakan sihir di luar sekolah.", amount: -80 },
                    { title: "Beli Perlengkapan Ramuan", text: "Membeli bahan baku ramuan mahal.", amount: -50 }
                ];
                const card = cards[Math.floor(Math.random() * cards.length)];
                player.money += card.amount;
                
                const verb = card.amount > 0 ? "mendapatkan" : "membayar";
                pushLog(`${player.name} membuka kartu: ${card.title} (${verb} £${Math.abs(card.amount)}).`);
                showMessage(card.title, `${card.text} Anda ${verb} £${Math.abs(card.amount)}.`, endTurnPhase);
            }
            else if (space.type === 'go_jail') {
                player.pos = 10;
                player.inJail = true;
                pushLog(`${player.name} ditangkap dan dikirim ke Azkaban!`);
                showMessage("Dikirim ke Azkaban!", "Anda melakukan pelanggaran berat dan dikirim ke Azkaban.", endTurnPhase);
            }
            else {
                await endTurnPhase();
            }
        }

        function showBuyModal(space, player) {
            document.getElementById('modal-prop-name').textContent = space.name;
            document.getElementById('modal-prop-price').textContent = `Harga Beli: £${space.price}`;
            modProp.classList.add('active');

            document.getElementById('btn-buy').onclick = async () => {
                player.money -= space.price;
                gameState.properties[player.pos] = { owner: player.id, houses: 1 };
                pushLog(`${player.name} berhasil membeli ${space.name} seharga £${space.price}!`);
                closeModal();
                await endTurnPhase();
            };

            document.getElementById('btn-pass').onclick = async () => {
                pushLog(`${player.name} memutuskan tidak membeli ${space.name}.`);
                closeModal();
                await endTurnPhase();
            };
        }

        function showMessage(title, text, callback) {
            document.getElementById('modal-msg-title').textContent = title;
            document.getElementById('modal-msg-text').textContent = text;
            modMsg.classList.add('active');
            document.getElementById('btn-msg-ok').onclick = async () => {
                modMsg.classList.remove('active');
                if (callback) await callback();
            };
        }

        function closeModal() {
            modProp.classList.remove('active');
            modMsg.classList.remove('active');
        }

        async function endTurnPhase() {
            gameState.phase = 'action';
            await saveStateToDB();
        }

        btnEnd.addEventListener('click', async () => {
            if (gameState.phase !== 'action') return;
            
            gameState.currentTurnIndex = (gameState.currentTurnIndex + 1) % gameState.turnOrder.length;
            gameState.phase = 'rolling';
            
            await saveStateToDB();
        });

        // Color Picker Event Listeners
        elColorPicks.forEach(btn => {
            btn.addEventListener('click', (e) => {
                elColorPicks.forEach(b => {
                    b.classList.remove('ring-2', 'ring-white', 'scale-110');
                    b.classList.add('border-transparent');
                });
                const target = e.target.closest('button');
                target.classList.add('ring-2', 'ring-white', 'scale-110');
                target.classList.remove('border-transparent');
                myColor = target.dataset.color;
            });
        });

        // Join Lobby Button Event Listener
        elBtnJoin.addEventListener('click', () => {
            const name = elPlayerName.value.trim();
            if (!name) {
                showMessage("Peringatan", "Silakan masukkan nama Anda terlebih dahulu.");
                return;
            }
            myName = name;
            
            // Set up Room ID
            let inputRoom = elRoomCode.value.trim().toUpperCase();
            if (!inputRoom) {
                // Generate acak jika dikosongkan
                inputRoom = 'HW-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            }
            ROOM_ID = inputRoom;
            elDisplayRoomId.textContent = ROOM_ID;
            
            // Tampilkan status loading di tombol
            elBtnJoin.disabled = true;
            elBtnJoin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menghubungkan...';
            
            initSupabase();

            drawDiceFace(document.getElementById('dice1'), 1);
            drawDiceFace(document.getElementById('dice2'), 1);
        });

        // Copy Room ID Button
        btnCopyRoom.addEventListener('click', () => {
            try {
                navigator.clipboard.writeText(ROOM_ID);
                const originalText = btnCopyRoom.innerHTML;
                btnCopyRoom.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i>Tersalin';
                setTimeout(() => btnCopyRoom.innerHTML = originalText, 2000);
            } catch (err) {
                // Fallback untuk iframe document restrictions
                const textArea = document.createElement("textarea");
                textArea.value = ROOM_ID;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("Copy");
                textArea.remove();
                
                const originalText = btnCopyRoom.innerHTML;
                btnCopyRoom.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i>Tersalin';
                setTimeout(() => btnCopyRoom.innerHTML = originalText, 2000);
            }
        });

        window.addEventListener('resize', renderBoard);
    </script>
</body>
</html>
