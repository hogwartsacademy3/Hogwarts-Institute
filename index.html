function home(v){let q=Object.values(S.quests).filter(q=>q.status==='active').slice(0,5);v.innerHTML=`<div class="hero"><div class="gold small">TAHUN 734 · ERA RETAK</div><h1>Mahkota Itu Tidak Memiliki Pewaris.</h1><p>Tujuh pecahan Mahkota Retak tersebar di Elarion. Pemerintah, pedagang, sarjana, pengasingan, dan jaringan bayangan memiliki versi sejarah yang berbeda. Pilihanmu akan menentukan mana yang bertahan.</p><div class="row"><button onclick="explore()">Eksplorasi</button><button onclick="advance(1);go('Beranda')">Tunggu 1 jam</button><button onclick="rest()">Beristirahat</button><button onclick="save(slot)">Simpan</button></div></div><div class="grid">${panel('Tujuan utama',q.length?q.map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.objective)}</p></div>`).join(''):'Alur utama selesai. Dunia tetap terbuka untuk endgame.')} ${panel('Keadaan dunia',`<div>Cuaca: <b>${S.world.weather}</b></div><div>Waktu: <b>${timeName()}</b></div><div>Stabilitas: <b>${worldStability()}%</b></div><div>Pecahan: <b>${S.flags.crownFragments}/7</b></div>`)} ${panel('Progress',`<div class="bar xp"><i style="width:${S.xp/S.xpNext*100}%"></i></div><p>XP ${S.xp}/${S.xpNext}</p><p>Fame ${S.fame} · Kehormatan ${S.honor} · Infamy ${S.infamy} · Wanted ${S.wanted}</p>`)} ${panel('Kronik terbaru',S.journal.slice(-6).reverse().map(x=>`<div class="item">${esc(x)}</div>`).join(''))}</div>`}
function panel(t,b){return `<div class="panel"><h2>${t}</h2>${b}</div>`}function timeName(){let h=S.world.hour;return h<6?'Tengah Malam':h<11?'Pagi':h<16?'Siang':h<20?'Sore':'Malam'}function worldStability(){return Math.max(0,Math.min(100,60-S.infamy*2+(S.honor>30?10:0)+(S.world.serivia==='developed'?8:0)))}

function smallAction(id){let x=DB.small.find(s=>s.id===id);advance(1);if(id==='kebun'){S.world.serivia='developed';S.fame+=5}if(id==='makam')discoverLore('L11');if(id==='mercusuar'){addItem('q26');S.reputation.f2+=3}toast(x.name+' diperiksa.');close()}
function specialLocation(id){if(id==='asterra'){S.skills.INVESTIGATION=Math.min(5,S.skills.INVESTIGATION+1);unlockSecret('sec1')}if(id==='lunaris'){S.reputation.f2+=3;S.fame+=2}if(id==='mirewood'){S.reputation.f4+=2;unlockSecret('sec2')}if(id==='irondeep'){if(S.world.hour<6||S.world.hour>=22){S.flags.firstMetal=true;addItem('m39');unlockSecret('sec3')}else toast('Terowongan terdalam hanya aman pada malam hari.')}if(id==='serevia'){S.world.serivia='developed';S.regionRep.serevia=(S.regionRep.serevia||0)+5}if(id==='ravenrock'){S.world.ravenrock='reconciled';S.reputation.f6+=8}if(id==='umbral'){S.reputation.f7+=5;unlockSecret('sec4')}if(id==='crownspire'){S.flags.gate=true}S.journal.push('Interaksi wilayah: '+findLoc(id).name+'.');checkAchievements();close();render()}
function dialog(id){let n=DB.npcs.find(x=>x.id===id);if(!n)return;S.codex.npcs.includes(id)||S.codex.npcs.push(id);let known=S.decisions['met_'+id]?'Kau sudah kembali. Aku masih mengingat percakapan kita.':'Aku belum pernah melihatmu sebelumnya.';let rumor=['Ada lonceng yang berbunyi dari bawah rawa.','Buku lama di Asterra menyebut tujuh sumpah.','Pedagang tertentu membeli kaca dari langit.','Jalan ke Ravenrock berubah ketika politik berubah.','Bunga Cermin hanya mekar dalam kabut tengah malam.'];open(n.name,`<p>${esc(known)}</p><p>${esc(n.bio)}</p><button class="choice" onclick="dialogAct('${id}','rumor')">Tanyakan rumor</button><button class="choice" onclick="dialogAct('${id}','help')">Tawarkan bantuan</button><button class="choice" onclick="dialogAct('${id}','quest')">Tanyakan pekerjaan</button>${S.skills.PERSUASION>=2?`<button class="choice" onclick="dialogAct('${id}','persuade')">Gunakan Persuasi</button>`:''}${S.skills.INVESTIGATION>=2?`<button class="choice" onclick="dialogAct('${id}','investigate')">Amati detail</button>`:''}`);S.decisions['met_'+id]=true}
function dialogAct(id,type){let n=DB.npcs.find(x=>x.id===id);if(type==='rumor'){let r=['Ada lonceng yang berbunyi dari bawah rawa.','Buku lama di Asterra menyebut tujuh sumpah.','Pedagang tertentu membeli kaca dari langit.','Jalan ke Ravenrock berubah ketika politik berubah.','Bunga Cermin hanya mekar dalam kabut tengah malam.'][Math.floor(Math.random()*5)];S.rumors.push(r);toast('Rumor: '+r)}if(type==='help'){S.decisions['helped_'+id]=true;S.honor+=2;gainXP(25);toast(n.name+' mengingat bantuanmu.')}if(type==='quest'){let q=DB.side[Math.floor(Math.random()*DB.side.length)];S.quests[q.id]={...q,status:'active',progress:0};toast('Quest terbuka: '+q.name)}if(type==='persuade'){let ok=S.stats.wisdom+S.skills.PERSUASION*5+Math.random()*10>=18;if(ok){S.reputation.f1+=8;S.fame+=4;toast('Persuasi berhasil.')}else{S.infamy+=2;toast('Persuasi gagal.')}}if(type==='investigate'){discoverLore('L'+(1+Math.floor(Math.random()*20)));gainXP(40);toast('Detail tersembunyi ditemukan.')}close();checkAchievements();render()}
function questPage(v){let all=[...DB.main,...DB.side,...DB.compq,...DB.fq,...DB.hidden];all.forEach(q=>{if(S.quests[q.id])return;if(q.id==='MQ01')return;if(q.id==='SQ01'&&S.level>=1)S.quests[q.id]={...q,status:'available',progress:0}});v.innerHTML=panel('Jurnal Misi',`<div class="row"><button onclick="unlockMain('MQ01')">Mulai Utama</button><button onclick="openQuestCategories()">Buka daftar jalur</button></div><div class="list">${Object.entries(S.quests).map(([id,q])=>`<div class="item"><div class="between"><b>${esc(q.name)}</b><span class="tag">${q.status}</span></div><p>${esc(q.objective||q.desc)}</p>${q.status==='available'?`<button onclick="accept('${id}')">Terima</button>`:''}${q.status==='active'?`<button onclick="workQuest('${id}')">Kerjakan</button>`:''}${q.status==='complete'?'<span class="good">Selesai</span>':''}</div>`).join('')}</div>`)}
function openQuestCategories(){open('Jalur Quest',`<h3>Utama</h3>${DB.main.map(q=>`<div class="item"><b>${q.id} · ${esc(q.name)}</b><p>${esc(q.objective)}</p><button onclick="unlockMain('${q.id}')">Buka</button></div>`).join('')}<h3>Companion</h3>${DB.compq.map(q=>`<div class="item"><b>${esc(q.name)}</b><button onclick="unlockMain('${q.id}')">Buka</button></div>`).join('')}<h3>Faksi</h3>${DB.fq.map(q=>`<div class="item"><b>${esc(q.name)}</b><button onclick="unlockMain('${q.id}')">Buka</button></div>`).join('')}</div>`)}
function unlockMain(id){let q=[...DB.main,...DB.side,...DB.compq,...DB.fq,...DB.hidden].find(q=>q.id===id);if(!q)return;if(id.startsWith('MQ')&&+id.slice(2)>1&&S.level<Math.min(2+(+id.slice(2)-1)*.25,8))return toast('Perkembangan cerita belum cukup.');S.quests[id]={...q,status:'active',progress:0};S.journal.push('Quest terbuka: '+q.name);toast('Quest terbuka: '+q.name);close();render()}
function accept(id){let q=[...DB.side,...DB.compq,...DB.fq,...DB.hidden].find(q=>q.id===id);if(q){S.quests[id]={...q,status:'active',progress:0};toast('Quest diterima: '+q.name);render()}}
function workQuest(id){let q=S.quests[id];if(!q)return;if(id==='MQ07')return choosePolitical();if(id==='MQ09')return startCase('INV1');if(id==='MQ17')return startCase('INV5');if(id==='MQ20'){if(S.flags.crownFragments>=5){S.flags.gate=true;discoverLoc('crownspire');complete(id)}else toast('Lima pecahan diperlukan untuk membuka gerbang.');return}if(id==='MQ27')return chooseCrown();if(id==='MQ29')return endingCheck();if(id==='MQ30')return endingCheck();if(q.companion&&!S.companions[q.companion])return toast('Companion belum bergabung.');if(Math.random()<.35){startCombat(pickEnemy(),()=>complete(id));return}if(q.id==='SQ04')S.world.serivia='developed';if(q.id==='SQ35'&&S.world.weather==='Kabut'&&S.world.hour<6)unlockSecret('sec2');complete(id)}
function complete(id){let q=S.quests[id];if(!q||q.status==='complete')return;q.status='complete';q.progress=1;S.completed.push(id);gainXP(q.xp||100);S.gold+=q.gold||0;S.journal.push('Quest selesai: '+q.name);if(id==='MQ01'){discoverLoc('lunaris');discoverLore('L03');S.quests.MQ02={...DB.main[1],status:'active',progress:0}}if(id==='MQ02'){discoverLoc('irondeep');S.quests.MQ03={...DB.main[2],status:'active',progress:0};S.reputation.f2+=8}if(id==='MQ03'){addItem('q3');S.quests.MQ04={...DB.main[3],status:'active',progress:0}}if(id==='MQ04'){addItem('q4');discoverLore('L13');S.quests.MQ05={...DB.main[4],status:'active',progress:0}}if(id==='MQ05'){discoverLoc('ashfall');S.quests.MQ06={...DB.main[5],status:'active',progress:0};addItem('m17',2)}if(id==='MQ06'){S.flags.crownFragments=Math.max(1,S.flags.crownFragments);S.quests.MQ07={...DB.main[6],status:'active',progress:0}}if(id==='MQ07'){S.quests.MQ08={...DB.main[7],status:'active',progress:0}}if(id==='MQ08'){addItem('q12');S.quests.MQ09={...DB.main[8],status:'active',progress:0};discoverLore('L05')}if(id==='MQ09'){S.flags.trueClue=true;S.quests.MQ10={...DB.main[9],status:'active',progress:0}}if(id==='MQ10'){S.world.ravenrock='reconciled';S.reputation.f6+=20;S.quests.MQ11={...DB.main[10],status:'active',progress:0}}if(id==='MQ11'){unlockSecret('sec5');S.quests.MQ12={...DB.main[11],status:'active',progress:0};discoverLore('L10')}if(id==='MQ12'){S.reputation.f7+=15;S.quests.MQ13={...DB.main[12],status:'active',progress:0}}if(id==='MQ13'){addItem('q9');S.flags.crownFragments++;S.quests.MQ14={...DB.main[13],status:'active',progress:0}}if(id==='MQ14'){S.reputation.f2+=15;S.quests.MQ15={...DB.main[14],status:'active',progress:0}}if(id==='MQ15'){addItem('m39');S.quests.MQ16={...DB.main[15],status:'active',progress:0};discoverLore('L06')}if(id==='MQ16'){S.flags.crownFragments++;S.quests.MQ17={...DB.main[16],status:'active',progress:0};discoverLore('L11')}if(id==='MQ17'){S.quests.MQ18={...DB.main[17],status:'active',progress:0}}if(id==='MQ18'){S.quests.MQ19={...DB.main[18],status:'active',progress:0};S.reputation.f6+=10}if(id==='MQ19'){S.flags.crownFragments++;S.quests.MQ20={...DB.main[19],status:'active',progress:0};unlockSecret('sec4')}if(id==='MQ20'){S.quests.MQ21={...DB.main[20],status:'active',progress:0}}if(id==='MQ21'){S.flags.crownFragments++;S.quests.MQ22={...DB.main[21],status:'active',progress:0};discoverLore('L12')}if(id==='MQ22'){S.flags.oldJournal=true;S.quests.MQ23={...DB.main[22],status:'active',progress:0};discoverLore('L13')}if(id==='MQ23'){S.quests.MQ24={...DB.main[23],status:'active',progress:0};S.honor+=15}if(id==='MQ24'){S.flags.storm=true;S.quests.MQ25={...DB.main[24],status:'active',progress:0}}if(id==='MQ25'){S.quests.MQ26={...DB.main[25],status:'active',progress:0}}if(id==='MQ26'){S.quests.MQ27={...DB.main[26],status:'active',progress:0}}if(id==='MQ27'){S.quests.MQ28={...DB.main[27],status:'active',progress:0}}if(id==='MQ28'){S.flags.shadowKing=true;S.quests.MQ29={...DB.main[28],status:'active',progress:0}}if(id==='MQ29'){S.quests.MQ30={...DB.main[29],status:'active',progress:0}}if(id.startsWith('CQ'))S.flags.companionQuest=true;checkAchievements();save(slot,true);render();toast('Quest selesai: '+q.name)}
function choosePolitical(){open('Pihak yang Dipilih',`<p>Pilihan ini memengaruhi faksi, companion, dan ending.</p><button class="choice" onclick="political('crown')">Mendukung Mahkota</button><button class="choice" onclick="political('exile')">Mendukung Pengasingan</button><button class="choice" onclick="political('independent')">Tetap Independen</button>`)}function political(x){S.decisions.political=x;if(x==='crown'){S.reputation.f1+=35;S.reputation.f6-=15}else if(x==='exile'){S.reputation.f6+=35;S.reputation.f1-=15}else{S.reputation.f4+=25;S.honor+=5}close();complete('MQ07')}
function chooseCrown(){open('Mahkota yang Memilih',`<p>Tujuh pecahan tidak harus menjadi satu. Apa yang kau pilih akan mengubah Elarion.</p><button class="choice" onclick="crownChoice('unite')">Satukan Mahkota</button><button class="choice" onclick="crownChoice('break')">Hancurkan Mahkota</button>`)}function crownChoice(x){S.decisions.crown=x;if(x==='unite'){S.flags.crownUnited=true;S.flags.crownFragments=7;addItem('r4');discoverLore('L03')}else{S.flags.crownBroken=true;S.world.crown='broken';S.honor-=20}close();complete('MQ27')}
function factionPage(v){v.innerHTML=panel('Faksi',`<div class="grid2">${DB.factions.map(f=>{let r=S.reputation[f.id]||0;let rank=r>=80?'Sekutu':r>=60?'Dipercaya':r>=40?'Ramah':r>=0?'Netral':r>=-30?'Tidak Disukai':'Hostile';return `<div class="card"><b>${esc(f.name)}</b><p>${esc(f.desc)}</p><div>Reputasi ${r} · ${rank}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,(r+100)/2))}%"></i></div><button onclick="factionWork('${f.id}')">Bantu</button></div>`}).join('')}</div>`)}
function factionWork(id){let r=S.reputation[id]||0;if(id==='f1'&&S.wanted>0){S.wanted--;S.honor+=3}else if(id==='f2'){S.gold=Math.max(0,S.gold-30);S.reputation.f2+=8}else if(id==='f3'){S.reputation.f3+=8;S.stats.defense++}else if(id==='f4'){if(has('m17')){removeItem('m17');S.reputation.f4+=12;discoverLore('L04')}else return toast('Bawa Serpih Mahkota sebagai bukti.')}else if(id==='f5'){S.reputation.f5+=8;S.honor+=3}else if(id==='f6'){S.reputation.f6+=8;S.world.ravenrock='reconciled'}else if(id==='f7'){S.reputation.f7+=8;S.infamy++;}else if(id==='f8'){if(has('m39')){S.reputation.f8+=12;S.profession.Smithing=Math.max(S.profession.Smithing,4)}else return toast('Klan Kharad meminta Logam Pertama.')}S.fame++;unlockMain('FQ'+id.slice(1));checkAchievements();render()}
function characterPage(v){let p=S.profile;v.innerHTML=panel('Lembar Karakter',`<div class="portraitgrid"><img class="avatar" src="${S._photoURL||''}"><div><div class="big">${esc(p.name)}</div><div class="gold">${esc(p.title)}</div><div>${esc(p.gender)} · ${esc(p.bg)}</div></div></div><p>${esc(p.desc)}</p><div class="grid2">${Object.entries(S.stats).map(([k,x])=>`<div class="item"><b>${k}</b><div class="big">${x}</div></div>`).join('')}</div><hr><label>Foto karakter <input type="file" accept="image/*" onchange="uploadPhoto(this)"></label><button onclick="deletePhoto()">Hapus foto</button>`)}
function inventoryPage(v){v.innerHTML=panel('Inventaris',`<div class="grid2">${Object.entries(S.inventory).filter(x=>x[1]>0).map(([id,n])=>{let i=findItem(id);return `<div class="item"><div class="between"><b>${esc(i?.name||id)}</b><span>x${n}</span></div><span class="tag">${i?.rarity||''}</span> <span class="tag">${i?.type||''}</span><p class="muted small">${esc(i?.effect||'')}</p>${i?.type==='Konsumsi'?`<button onclick="useItem('${id}')">Gunakan</button>`:''}</div>`}).join('')}</div>`)}
function equipmentPage(v){v.innerHTML=panel('Equipment',`<div class="grid2">${[['weapon','Senjata'],['armor','Armor'],['accessory','Aksesori']].map(([s,t])=>{let i=findItem(S.equipment[s]);return `<div class="item"><b>${t}</b><p>${i?esc(i.name):'Kosong'}</p><button onclick="equipPicker('${s}','${t}')">Pilih</button></div>`}).join('')}</div><p class="muted">Stat combat saat ini: ${JSON.stringify(totalStats())}</p>`)}
function equipPicker(s,t){let arr=DB.items.filter(i=>i.type===t&&S.inventory[i.id]);open('Pilih '+t,arr.map(i=>`<div class="item"><b>${esc(i.name)}</b><span class="tag">${i.rarity}</span><p>${esc(i.effect)}</p><button onclick="equip('${s}','${i.id}')">Pasang</button></div>`).join('')||'Tidak ada item.')}
function equip(s,id){S.equipment[s]=id;close();render();toast('Equipment diperbarui.')}
function totalStats(){let t={...S.stats};Object.values(S.equipment).forEach(id=>{let i=findItem(id);if(i){t.attack+=i.atk||0;t.defense+=i.def||0;t.magic+=i.magic||0}});t.attack+=S.skills.COMBAT*3;t.magic+=S.skills.ARCANA*3;t.speed+=S.skills.SURVIVAL*2;return t}
function skillPage(v){let def={COMBAT:['Serangan Kuat','Tangkisan','Serangan Balik','Fokus Kritis','Veteran'],SURVIVAL:['Langkah Ringan','Pengumpulan','Pemburu Malam','Jejak Rahasia','Survivalis'],ARCANA:['Konsentrasi','Perisai Mana','Pengetahuan Relik','Pemecah Sihir','Arkana Tinggi'],INVESTIGATION:['Amati Bukti','Analisis','Kontradiksi','Rekonstruksi','Mata Kebenaran'],PERSUASION:['Bujuk','Tawar Harga','Intimidasi','Diplomasi','Karisma']};v.innerHTML=panel('Skill Tree',Object.entries(def).map(([b,ns])=>`<div class="card"><h3>${b}</h3>${ns.map((n,i)=>`<div class="item"><b>${i+1}. ${n}</b><p class="small muted">${skillDesc(b,i)}</p><button onclick="learn('${b}',${i+1})" ${S.skills[b]>=i+1||S.skills[b]!==i?'disabled':''}>${S.skills[b]>=i+1?'Terbuka':'Buka'}</button></div>`).join('')}</div>`).join(''))}function skillDesc(b,i){return {COMBAT:['Kerusakan +3%.','Bertahan lebih kuat.','Serangan balik meningkat.','Critical +4%.','Attack +8.'],SURVIVAL:['Evasion +2.','Material tambahan.','Encounter malam lebih aman.','Petunjuk rahasia lebih mudah.','Hasil gathering +10%.'],ARCANA:['Mana maksimum +10.','Perisai awal combat.','Artefak dapat diidentifikasi.','Peluang meniadakan serangan sihir.','Magic +12.'],INVESTIGATION:['Bukti tambahan.','Analisis lebih akurat.','Kontradiksi muncul.','Rekonstruksi kasus.','Membuka rahasia.'],PERSUASION:['Dialog lunak.','Diskon 5%.','Intimidasi.','Diplomasi.','Dialog langka.']}[b][i]}
function learn(b,l){if(S.skills[b]!==l-1)return;S.skills[b]=l;if(b==='ARCANA'&&l===5)S.stats.magic+=12;if(b==='COMBAT'&&l===5)S.stats.attack+=8;toast('Skill '+b+' tingkat '+l+' terbuka.');checkAchievements();render()}
function partyPage(v){v.innerHTML=panel('Party',`<div class="grid2">${S.party.map(n=>`<div class="item"><b>${esc(n)}</b><p>Loyalitas ${S.companions[n].loyalty}</p><button onclick="reserve('${n}')">Cadangkan</button></div>`).join('')||'Belum ada anggota aktif.'}</div><h3>Cadangan</h3>${S.reserve.map(n=>`<button onclick="activate('${n}')">${esc(n)}</button>`).join(' ')||'Tidak ada cadangan.'}`)}
function companionPage(v){v.innerHTML=panel('Companion',`<div class="grid2">${DB.companions.map(c=>{let x=S.companions[c.name];return `<div class="card"><div class="portraitgrid"><div class="avatar sm" style="display:grid;place-items:center">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b><div class="muted">${esc(c.role)}</div></div></div><p>${esc(c.bio)}</p><span class="tag">${c.skill}</span><p>Loyalitas: ${x?.loyalty||0}</p><button onclick="recruit('${c.name}')">${x?'Rekrut/Temui':'Rekrut'}</button>${x?`<button onclick="loyalty('${c.name}')">Bangun loyalitas</button><button onclick="unlockCompQuest('${c.name}')">Quest pribadi</button>`:''}</div>`}).join('')}</div>`)}
function recruit(name){let c=DB.companions.find(x=>x.name===name);if(!c)return;if(S.companions[name])return toast('Companion sudah bergabung.');let req={Lyra:0,Cale:10,Nadia:15,Kaia:20,Mila:30,Juno:5,Veyra:35,Kara:40}[name]??0;if((S.reputation.f4||0)<req&&['Nadia','Veyra'].includes(name))return toast('Reputasi Lingkaran Arkanis belum cukup.');if(name==='Mila'&&(S.reputation.f6||0)<10)return toast('Reputasi Pengasingan belum cukup.');if(name==='Kara'&&(S.reputation.f8||0)<10)return toast('Klan Kharad belum mempercayaimu.');S.companions[name]={level:S.level,loyalty:45};if(S.party.length<3)S.party.push(name);else S.reserve.push(name);S.journal.push(name+' bergabung ke kelompok.');toast(name+' bergabung.');checkAchievements();save(slot,true);render()}
function reserve(n){S.party=S.party.filter(x=>x!==n);S.reserve.push(n);render()}function activate(n){if(S.party.length>=3)return toast('Party sudah penuh.');S.reserve=S.reserve.filter(x=>x!==n);S.party.push(n);render()}function loyalty(n){let c=S.companions[n];if(S.gold<40)return toast('Membutuhkan 40 gold.');S.gold-=40;c.loyalty=Math.min(100,c.loyalty+10);toast('Loyalitas '+n+' meningkat.');render()}function unlockCompQuest(n){let i=DB.companions.findIndex(c=>c.name===n);let q=DB.compq[i];if(q){S.quests[q.id]={...q,status:'active',progress:0};toast('Quest companion terbuka.');render()}}
function codexPage(v){let lore=DB.lore.filter(x=>S.codex.lore.includes(x.id)),ns=DB.npcs.filter(x=>S.codex.npcs.includes(x.id)),es=DB.enemies.filter(x=>S.codex.enemies.includes(x.id)),bs=DB.bosses.filter(x=>S.codex.bosses.includes(x.id));v.innerHTML=panel('Codex',`<h3>Lore ${lore.length}/${DB.lore.length}</h3><div class="grid2">${lore.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join('')}</div><h3>Karakter ${ns.length}/${DB.npcs.length}</h3><div class="grid2">${ns.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${esc(x.job)}</div>`).join('')}</div><h3>Monster ${es.length}/${DB.enemies.length}</h3><div class="grid2">${es.map(x=>`<div class="item"><b>${esc(x.name)}</b> — kelemahan ${esc(x.weak)}</div>`).join('')}</div><h3>Boss ${bs.length}/${DB.bosses.length}</h3><div class="grid2">${bs.map(x=>`<div class="item"><b>${esc(x.name)}</b></div>`).join('')}</div>`)}
function discoverLore(id){if(!S.codex.lore.includes(id)){S.codex.lore.push(id);toast('Lore ditemukan.')}}function unlockSecret(id){if(!S.secrets.includes(id)){S.secrets.push(id);discoverLore('L'+(10+S.secrets.length));toast('Area rahasia ditemukan.')}}
function journalPage(v){v.innerHTML=panel('Jurnal',`<h3>Catatan</h3><div class="list">${S.journal.slice().reverse().map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><h3>Keputusan</h3><pre>${esc(JSON.stringify(S.decisions,null,2))}</pre>`)}
function craftPage(v){v.innerHTML=panel('Crafting',`<p>Resep terbuka ${S.craftFound.length}/${DB.recipes.length}. Profesi membatasi resep tingkat tinggi.</p><div class="grid2">${DB.recipes.filter(r=>S.craftFound.includes(r.id)).map(r=>{let ok=r.materials.every(m=>(S.inventory[m[0]]||0)>=m[1])&&S.profession[r.profession]>=r.level;let out=findItem(r.result);return `<div class="item"><b>${esc(r.name)}</b><span class="tag">${r.profession} Lv ${r.level}</span><p>${r.materials.map(m=>esc(findItem(m[0])?.name||m[0])+' x'+m[1]).join(', ')}</p><p>Hasil: ${esc(out?.name||r.result)}</p><button ${ok?'':'disabled'} onclick="craft('${r.id}')">Buat</button></div>`}).join('')}</div>`)}
function craft(id){let r=DB.recipes.find(x=>x.id===id);if(!r||!S.craftFound.includes(id)||S.profession[r.profession]<r.level)return toast('Resep atau tingkat profesi belum memenuhi.');if(!r.materials.every(m=>(S.inventory[m[0]]||0)>=m[1]))return toast('Bahan tidak cukup.');r.materials.forEach(m=>S.inventory[m[0]]-=m[1]);addItem(r.result);profGain(r.profession,35);gainXP(60);toast('Berhasil membuat '+findItem(r.result).name);render()}
function professionPage(v){v.innerHTML=panel('Profesi',Object.entries(S.profession).map(([p,l])=>`<div class="item"><div class="between"><b>${p}</b><b>Lv ${l}</b></div><div class="bar xp"><i style="width:${Math.min(100,S.profXp[p]/(l*100)*100)}%"></i></div><div class="small">${S.profXp[p]}/${l*100} XP</div></div>`).join('')+`<hr><button onclick="gatherAction('Mining')">Mining</button> <button onclick="gatherAction('Herbalism')">Herbalism</button> <button onclick="gatherAction('Cooking')">Fishing</button> <button onclick="gatherAction('Survival')">Hunting</button> <button onclick="gatherAction('Gathering')">Gathering</button>`)}
function profGain(p,n){if(!S.profXp[p])S.profXp[p]=0;S.profXp[p]+=n;while(S.profXp[p]>=S.profession[p]*100&&S.profession[p]<10){S.profXp[p]-=S.profession[p]*100;S.profession[p]++;toast(p+' naik ke level '+S.profession[p])}}
function gatherAction(type='Mining'){advance(1);let pool=DB.items.filter(i=>i.type==='Material');if(type==='Mining')pool=pool.filter(i=>['m2','m3','m11','m12','m13','m27','m39'].includes(i.id));if(type==='Herbalism')pool=pool.filter(i=>['m4','m5','m6','m7','m23','m24','m40'].includes(i.id));if(S.world.weather==='Kabut')pool=pool.filter(i=>i.id==='m6'||i.id==='m23'||i.id==='m38'||i.id==='m24').concat(pool.slice(0,2));let it=pool[Math.floor(Math.random()*pool.length)]||DB.items.find(i=>i.id==='m1');let q=1+(S.skills.SURVIVAL>=2?1:0);addItem(it.id,q);profGain(['Mining','Herbalism','Cooking','Survival','Survival'].includes(type)?type:'Mining',20);toast('Mendapat '+it.name+' x'+q);render()}
function shopPage(v){let pool=DB.items.filter(i=>i.price>0&&i.type!=='Quest'&&i.rarity!=='Mitos').slice(0,75);v.innerHTML=panel('Toko',`<p>Harga dipengaruhi reputasi Serikat Pedagang. Pasar khusus terbuka setelah tengah malam di Lunaris.</p><div class="grid2">${pool.map(i=>{let p=Math.max(1,Math.floor(i.price*(1-Math.min(30,S.reputation.f2||0)/100)));return `<div class="item"><b>${esc(i.name)}</b><span class="tag">${i.rarity}</span><p>${p} gold</p><button onclick="buy('${i.id}',${p})">Beli</button><button onclick="sell('${i.id}')">Jual</button></div>`}).join('')}</div>`)}
function buy(id,p){if(S.gold<p)return toast('Gold tidak cukup.');S.gold-=p;addItem(id);toast('Membeli '+findItem(id).name);render()}function sell(id){if(!S.inventory[id])return;let i=findItem(id);if(!i||i.price<=0)return;S.inventory[id]--;S.gold+=Math.floor(i.price*.45);toast('Item dijual.');render()}
function bountyPage(v){let arr=DB.enemies.slice(5,20);v.innerHTML=panel('Bounty',`<p>Target dapat diselesaikan dengan combat. Target tertentu menjadi lebih sulit pada mode Sulit dan Mimpi Buruk.</p><div class="grid2">${arr.map((e,i)=>`<div class="item"><b>${esc(e.name)}</b><p>Hadiah ${120+i*35} gold.</p><button onclick="takeBounty('${e.id}',${120+i*35})">Ambil</button></div>`).join('')}</div>`)}function takeBounty(id,reward){if(S.bounties[id]?.done)return toast('Bounty sudah selesai.');S.bounties[id]={active:true};startCombat(DB.enemies.find(e=>e.id===id),()=>{S.bounties[id]={done:true};S.gold+=reward;S.fame+=4;toast('Bounty selesai.');checkAchievements();render()})}
function investigationPage(v){v.innerHTML=panel('Investigasi',`<p>Kasus tidak memberikan jawaban sebelum kesimpulan. Kumpulkan bukti, wawancarai saksi melalui NPC, lalu tentukan tersangka.</p><div class="grid2">${DB.investigations.map((c,i)=>`<div class="item"><b>${esc(c.name)}</b><p>${esc(c.desc)}</p><span class="tag">${S.caseProgress[c.id]||'belum dimulai'}</span><button onclick="startCase('${c.id}')">Mulai</button></div>`).join('')}</div>`)}
function startCase(id){let c=DB.investigations.find(x=>x.id===id);if(!c)return;let key=id+'_e',found=S.caseProgress[key]||[];open(c.name,`<p>${esc(c.desc)}</p><p><b>Tersangka:</b> ${c.suspects.map(esc).join(', ')}</p><p><b>Bukti:</b> ${found.length}/${c.evidence.length}</p>${c.evidence.map((e,i)=>`<button class="choice" onclick="evidence('${id}',${i})">${found.includes(i)?'Bukti sudah diperiksa':'Periksa: '+esc(e)}</button>`).join('')}${found.length>=2?'<hr><b>Kesimpulan</b>'+c.suspects.map(s=>`<button class="choice" onclick="solveCase('${id}','${s}')">Tuduh ${esc(s)}</button>`).join(''):''}`)}
function evidence(id,i){let c=DB.investigations.find(x=>x.id===id),key=id+'_e',a=S.caseProgress[key]||[];if(!a.includes(i)){a.push(i);S.caseProgress[key]=a;gainXP(35)}close();startCase(id)}function solveCase(id,a){let c=DB.investigations.find(x=>x.id===id);if(a===c.answer){S.caseProgress[id]='solved';S.honor+=8;gainXP(c.xp);if(id==='INV5')S.flags.trueClue=true;toast('Kesimpulan benar.')}else{S.caseProgress[id]='failed';S.wanted++;S.infamy+=5;toast('Kesimpulan salah; konsekuensi dicatat.')}close();checkAchievements();render()}
function puzzlePage(v){v.innerHTML=panel('Puzzle',`<p>Beberapa puzzle memiliki hadiah yang tidak tersedia di toko.</p><div class="grid2">${[['p1','Cipher Menara','Geser setiap huruf satu langkah ke belakang. Kode: GNGNXNR','FMFMWMQ','r14'],['p2','Urutan Segel','Urutkan simbol berdasarkan usia: Matahari, Batu, Bayangan, Mahkota. Masukkan 1-2-3-4.','1-2-3-4','r15'],['p3','Kesaksian Cuaca','Saat badai, tanyakan kepada saksi yang berubah sesuai cuaca. Jawaban: saksi cuaca.','saksi cuaca','r17'],['p4','Kunci Logam','Masukkan jumlah pecahan mahkota dikali tujuh.','21','r19'],['p5','Taman Cermin','Cuaca yang membuat bunga Cermin mekar?','kabut','r20']].map(p=>`<div class="item"><b>${p[1]}</b><p>${p[2]}</p><button onclick="solvePuzzle('${p[0]}','${p[3]}','${p[4]}')">Coba</button></div>`).join('')}</div>`)}
function solvePuzzle(id,ans,reward){open('Jawab Puzzle',`<p>Masukkan jawaban.</p><input id="pa" style="width:100%;padding:10px;background:#0d131b;color:white;border:1px solid #303b4a;border-radius:8px"><button onclick="checkPuzzle('${id}','${ans}','${reward}')">Periksa</button>`)}function checkPuzzle(id,ans,reward){if($('#pa').value.trim().toLowerCase()===ans.toLowerCase()){S.puzzles[id]=true;addItem(reward);gainXP(250);toast('Puzzle berhasil.');close();checkAchievements();render()}else toast('Jawaban belum tepat.')} 
function enterDungeon(id){let d=DB.dungeons.find(x=>x.id===id);if(!d)return;if(d.id==='d7'&&S.flags.crownFragments<5)return toast('Lima pecahan diperlukan.');if(d.id==='d8'&&S.level<10)return toast('Level 10 diperlukan.');let st=S.dungeons[id]||{room:0,cleared:false};S.dungeons[id]=st;open(d.name,`<p>${esc(d.desc)}</p><p>Ruang ${st.room}/5.</p><button onclick="dungeonStep('${id}')">Masuk lebih dalam</button><button onclick="dungeonPuzzle('${id}')">Periksa mekanisme</button><p class="muted">Boss: ${esc(d.boss)}</p>`)}
function dungeonPuzzle(id){let p=id==='d3'?'p2':id==='d7'?'p4':'p1';close();solvePuzzle(p,'',p==='p1'?'r14':'r15')}
function dungeonStep(id){let d=DB.dungeons.find(x=>x.id===id),st=S.dungeons[id];st.room++;advance(1);if(st.room>=5){let b=DB.bosses.find(x=>x.name===d.boss);close();startCombat(b,()=>{st.cleared=true;addItem(randomRarity(['Langka','Epik','Legendaris']).id);toast('Dungeon selesai.');render()});return}if(Math.random()<.6){close();startCombat(pickEnemy())}else{let i=DB.items.filter(i=>i.type==='Material')[Math.floor(Math.random()*40)];addItem(i.id);toast('Treasure ditemukan: '+i.name);close();enterDungeon(id)}}
function randomRarity(rs){let a=DB.items.filter(i=>rs.includes(i.rarity)&&i.price>0);return a[Math.floor(Math.random()*a.length)]}function pickEnemy(){let pool=DB.enemies;if(S.world.weather==='Kabut')pool=pool.slice(0,25);if(S.level>=8)pool=DB.enemies.slice(10);return pool[Math.floor(Math.random()*pool.length)]}
function startCombat(enemy,onWin=null){if(combat)return toast('Pertarungan sedang berlangsung.');let d={Cerita:.75,Normal:1,Sulit:1.25,'Mimpi Buruk':1.55}[S.difficulty||'Normal']||1;let e={...enemy,maxHp:Math.floor(enemy.hp*d),hp:Math.floor(enemy.hp*d),phase:1};combat={enemy:e,onWin,turn:1,log:['Pertarungan dimulai melawan '+enemy.name+'.'],def:false,boss:e.maxHp>500};S.codex.enemies.includes(enemy.id)||S.codex.enemies.push(enemy.id);if(combat.boss){beep('boss');}renderCombat()}
function renderCombat(){if(!combat){return}open('Pertarungan: '+combat.enemy.name,`<div class="between"><b>${esc(combat.enemy.name)}</b><span>Fase ${combat.enemy.phase}</span></div><div class="bar hp"><i style="width:${Math.max(0,combat.enemy.hp/combat.enemy.maxHp*100)}%"></i></div><p>HP musuh ${Math.max(0,combat.enemy.hp)}/${combat.enemy.maxHp}</p><p>HP ${S.hp}/${S.maxHp} · Mana ${S.mana}/${S.maxMana}</p><div class="row"><button onclick="fight('attack')">Serang</button><button onclick="fight('skill')">Skill</button><button onclick="fight('item')">Item</button><button onclick="fight('def')">Bertahan</button><button onclick="fight('run')">Melarikan diri</button></div><div class="item scroll">${combat.log.slice(-10).map(esc).join('<br>')}</div>`)}
function fight(a){if(!combat)return;let e=combat.enemy,t=totalStats();combat.turn++;if(a==='run'){if(Math.random()<(0.45+t.speed/100)){combat=null;close();toast('Berhasil melarikan diri.');render();return}combat.log.push('Pelarian gagal.')}else if(a==='def'){combat.def=true;combat.log.push('Kau bertahan.')}else if(a==='item'){let id=Object.keys(S.inventory).find(i=>S.inventory[i]>0&&findItem(i)?.type==='Konsumsi');if(id)useSilent(id);else combat.log.push('Tidak ada konsumsi.')}else if(a==='skill'){if(S.mana<12){combat.log.push('Mana tidak cukup.')}else{S.mana-=12;let dmg=Math.floor((t.attack+t.magic*1.7)*(1+S.skills.COMBAT*.08));if(e.weak==='Api')dmg=Math.floor(dmg*1.25);if(e.res==='Arcana')dmg=Math.floor(dmg*.65);e.hp-=dmg;combat.log.push('Skill menghasilkan '+dmg+' kerusakan.')}}else{let hit=Math.random()*100<t.accuracy;if(hit){let dmg=Math.max(1,t.attack-e.def+Math.floor(Math.random()*7));if(e.weak==='Fisik')dmg=Math.floor(dmg*1.15);if(S.skills.COMBAT>=4&&Math.random()<.12)dmg*=2; e.hp-=Math.floor(dmg);combat.log.push('Serangan menghasilkan '+Math.floor(dmg)+' kerusakan.')}else combat.log.push('Serangan meleset.')}if(e.hp<=0)return winCombat();if(combat.boss&&e.hp<e.maxHp*.55&&e.phase===1){e.phase=2;e.atk+=18;e.def+=8;combat.log.push('Boss memasuki fase kedua dan mengubah pola serangan.')}if(combat.boss&&e.hp<e.maxHp*.25&&e.phase===2){e.phase=3;e.atk+=22;combat.log.push('Boss memasuki fase ketiga. Serangan khusus menjadi lebih sering.')}let dmg=Math.max(1,e.atk-t.def+Math.floor(Math.random()*8));if(combat.turn%3===0)dmg+=12;if(combat.def)dmg=Math.floor(dmg*.45);if(Math.random()*100<t.evasion)dmg=0;S.hp-=dmg;combat.log.push(e.name+' menyerang: '+dmg+' kerusakan.');combat.def=false;if(S.hp<=0)return lose();renderCombat()}
function useSilent(id){let i=findItem(id);S.inventory[id]--;S.hp=Math.min(S.maxHp,S.hp+(i.heal||0));S.mana=Math.min(S.maxMana,S.mana+Math.floor((i.heal||0)/3));combat.log.push('Menggunakan '+i.name+'.')}
function winCombat(){let e=combat.enemy,g=50+Math.floor(Math.random()*120)+(combat.boss?300:0);S.gold+=g;gainXP(Math.floor(e.maxHp/3));S.flags.kills++;if(combat.boss)S.flags.bossKills++;let drop=combat.boss?randomRarity(['Langka','Epik','Legendaris']):randomRarity(['Biasa','Tidak Umum','Langka']);addItem(drop.id);if(combat.boss&&Math.random()<.25&&S.flags.crownFragments<7){S.flags.crownFragments++;addItem('q17');toast('Serpihan Mahkota ditemukan.')}if(e.name==='Raja Bayangan')S.flags.shadowKing=true;if(timeName()==='Tengah Malam')S.flags.nightWin=true;combat.log.push('Menang. '+g+' gold dan '+drop.name+' diperoleh.');beep('win');let cb=combat.onWin;combat=null;close();checkAchievements();save(slot,true);if(cb)cb();else render()}
function lose(){combat=null;close();S.gold=Math.floor(S.gold*.8);S.hp=Math.floor(S.maxHp*.5);S.wanted=Math.max(0,S.wanted-1);advance(12);toast('Kau kalah. Sebagian gold hilang.');render()}
function homePage(v){v.innerHTML=panel('Rumah',`<p>Rumah adalah tempat aman untuk menyimpan barang, menampilkan artefak, dan memulihkan kondisi.</p><div class="grid2"><div class="item">Level ${S.home.level}<br>Penyimpanan ${S.home.storage}<br><button onclick="upgradeHome()">Upgrade (${300*S.home.level} gold)</button></div><div class="item">Display ${S.home.displays}<br><button onclick="displayItem()">Tampilkan item</button></div></div><button onclick="rest()">Tidur</button>`)}function upgradeHome(){let c=300*S.home.level;if(S.gold<c)return toast('Gold tidak cukup.');S.gold-=c;S.home.level++;S.home.storage+=20;S.home.displays++;toast('Rumah ditingkatkan.');checkAchievements();render()}function displayItem(){let id=S.collection.find(i=>S.inventory[i]&&findItem(i)?.type==='Artefak');if(!id)return toast('Tidak ada artefak untuk display.');S.inventory[id]--;S.home.displays++;toast('Artefak ditampilkan di rumah.');render()}
function bankPage(v){v.innerHTML=panel('Bank',`<div class="big">${S.bankGold} gold</div><button onclick="deposit(100)">Simpan 100</button><button onclick="withdraw(100)">Ambil 100</button><p class="muted">Bank menggunakan state save yang sama dan tidak membutuhkan server.</p>`)}function deposit(n){if(S.gold<n)return toast('Gold tidak cukup.');S.gold-=n;S.bankGold+=n;checkAchievements();render()}function withdraw(n){if(S.bankGold<n)return toast('Saldo tidak cukup.');S.bankGold-=n;S.gold+=n;render()}
function mailPage(v){v.innerHTML=panel('Surat',`${S.mail.map(m=>`<div class="item"><b>${esc(m.from)}</b><p>${esc(m.text)}</p></div>`).join('')||'Kotak surat kosong.'}<button onclick="receiveMail()">Periksa kotak surat</button>`)}function receiveMail(){let l=[['Arven','Arsip menemukan kata yang hilang. Cari Buku Cipher.'],['Mila','Ravenrock berubah; jangan percaya kabar pertama yang kau dengar.'],['Nadia','Kristal di Menara Abu bereaksi pada pecahan.'],['Nyx','Seseorang menghapus nama dari dokumen pelabuhan.'],['Irena','Pengadilan membutuhkan saksi yang berani.']][S.mail.length%5];S.mail.push({from:l[0],text:l[1]});toast('Surat baru diterima.');checkAchievements();render()}
function achievementPage(v){v.innerHTML=panel('Achievement',`<p>${S.achievements.length}/${DB.achievements.length} terbuka.</p><div class="grid2">${DB.achievements.map(a=>`<div class="item"><b>${S.achievements.includes(a.id)?'Terbuka':'Rahasia'} — ${esc(a.name)}</b><p class="small">${S.achievements.includes(a.id)?esc(a.desc):'Syarat disembunyikan.'}</p></div>`).join('')}</div>`)}
function checkAchievements(){let ok=(id,c)=>{if(c&&!S.achievements.includes(id)){S.achievements.push(id);let a=DB.achievements.find(x=>x.id===id);toast('Achievement: '+a.name);beep('level')}};ok('A01',S.level>=2);ok('A02',S.codex.lore.length>=5);ok('A03',S.discovered.length>=5);ok('A04',S.discovered.length>=15);ok('A05',Object.values(S.caseProgress).includes('solved'));ok('A06',DB.investigations.every(x=>S.caseProgress[x.id]==='solved'));ok('A07',S.profession.Smithing>=5);ok('A08',S.profession.Alchemy>=5);ok('A09',S.profession.Cooking>=5);ok('A10',S.flags.kills>=25);ok('A11',Object.values(S.reputation).some(x=>x>=50));ok('A12',Object.values(S.reputation).some(x=>x>=80));ok('A13',S.fame>=50);ok('A14',S.wanted>=3);ok('A15',S.wanted===0&&S.infamy>0);ok('A16',S.home.level>=2);ok('A17',S.bankGold>=500);ok('A18',S.mail.length>=5);ok('A19',Object.values(S.bounties).filter(x=>x.done).length>=5);ok('A20',S.collection.length>=25);ok('A21',S.world.serivia==='developed');ok('A22',S.world.ravenrock==='reconciled');ok('A23',S.reputation.f6>=80);ok('A24',S.reputation.f5>=80);ok('A25',S.reputation.f7>=80);ok('A26',S.reputation.f8>=80);ok('A27',S.secrets.length>=1);ok('A28',Object.keys(S.puzzles).filter(k=>S.puzzles[k]).length>=5);ok('A29',S.flags.bossKills>=10);ok('A30',S.collection.some(id=>findItem(id)?.rarity==='Mitos'));ok('A31',Object.keys(S.companions).length>=4);ok('A32',Object.keys(S.companions).length>=8);ok('A34',S.quests.MQ09?.status==='complete');ok('A35',S.quests.MQ30?.status==='complete');ok('A36',S.gold>=5000);ok('A37',Object.values(S.skills).reduce((a,b)=>a+b,0)>=10);ok('A38',S.flags.storm);ok('A39',S.collection.filter(id=>findItem(id)?.type==='Artefak').length>=10);ok('A40',S.discovered.length>=20);ok('A41',S.flags.nightWin);ok('A42',S.flags.companionQuest);ok('A43',Object.values(S.reputation).filter(x=>x>=60).length>=2);ok('A44',S.codex.lore.length+S.codex.npcs.length+S.codex.enemies.length>=15);ok('A45',S.world.serivia==='developed');ok('A46',S.flags.crownUnited);ok('A47',S.flags.crownBroken);ok('A48',S.flags.shadowKing);ok('A49',S.ending==='true');ok('A50',S.newGamePlus)}
function settingsPage(v){v.innerHTML=panel('Pengaturan',`<p>Mode permainan menentukan kekuatan musuh dan tekanan progression.</p><select onchange="S.difficulty=this.value;save(slot,true)"><option ${S.difficulty==='Cerita'?'selected':''}>Cerita</option><option ${S.difficulty==='Normal'||!S.difficulty?'selected':''}>Normal</option><option ${S.difficulty==='Sulit'?'selected':''}>Sulit</option><option ${S.difficulty==='Mimpi Buruk'?'selected':''}>Mimpi Buruk</option></select><button onclick="beep('click')">Tes audio lokal</button>`)}
function savePage(v){Promise.all([1,2,3].map(i=>get(STORE,i))).then(xs=>{v.innerHTML=panel('Save & Backup',`${xs.map((x,i)=>`<div class="item"><b>Slot ${i+1}</b><p>${x?esc(x.profile?.name||'Tanpa Nama')+' · Lv '+x.level:'Kosong'}</p><button onclick="save(${i+1})">Simpan</button><button onclick="load(${i+1})">Muat</button><button onclick="deleteSlot(${i+1})">Hapus</button></div>`).join('')}<hr><button onclick="exportSave()">Export Save JSON</button><label><input id="imp" type="file" accept="application/json" hidden><button onclick="$('#imp').click()">Import Save JSON</button></label><button onclick="backup()">Backup Lokal</button><button onclick="resetAll()">Reset Game</button>`);$('#imp').onchange=importSave})}
async function deleteSlot(n){if(confirm('Hapus Slot '+n+'?')){await del(STORE,n);localStorage.removeItem('elarion_slot_'+n);toast('Slot dihapus.');go('Save')}}async function backup(){await put(STORE,'backup',clone(S));toast('Backup lokal dibuat.')}function exportSave(){let x=clone(S);delete x._photoURL;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({game:'Elarion',version:VERSION,save:x})],{type:'application/json'}));a.download='elarion-save.json';a.click();URL.revokeObjectURL(a.href)}function importSave(){let f=$('#imp').files?.[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(x.game!=='Elarion'||!x.save)throw 0;S=normalize(x.save);save(1,true).then(()=>{render();toast('Save diimpor.')})}catch(e){toast('Save tidak valid.')}})}async function resetAll(){if(!confirm('Hapus semua save lokal?'))return;for(let i=1;i<=3;i++)await del(STORE,i);localStorage.removeItem('elarion_settings');location.reload()}
function open(t,b){$('#box').innerHTML=`<div class="between"><h2>${esc(t)}</h2><button onclick="close()">Tutup</button></div>${b}`;$('#modal').classList.add('open')}function close(){if(combat)return;$('#modal').classList.remove('open')}
function addItem(id,n=1){if(!S.inventory[id])S.inventory[id]=0;S.inventory[id]+=n;if(!S.collection.includes(id))S.collection.push(id);if(findItem(id)?.rarity==='Mitos')toast('Item Mitos diperoleh: '+findItem(id).name)}function removeItem(id,n=1){S.inventory[id]=Math.max(0,(S.inventory[id]||0)-n);if(!S.inventory[id])delete S.inventory[id]}function has(id,n=1){return(S.inventory[id]||0)>=n}
function gainXP(n){S.xp+=n;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=Math.floor(S.xpNext*1.18);S.maxHp+=14;S.maxMana+=5;S.maxStamina+=4;S.hp=S.maxHp;S.mana=S.maxMana;S.stamina=S.maxStamina;S.stats.attack+=2;S.stats.defense++;toast('Level '+S.level+' tercapai.');beep('level')}}
function professionUnlocks(){for(let r of DB.recipes)if(S.profession[r.profession]>=r.level&&!S.craftFound.includes(r.id)&&r.level<=S.profession[r.profession])S.craftFound.push(r.id)}
function professionPageOld(){}
function endgame(){return}
function endingCheck(){let trueEnd=S.flags.trueClue&&S.flags.crownUnited&&S.flags.shadowKing&&S.secrets.includes('sec5')&&DB.investigations.every(x=>S.caseProgress[x.id]==='solved')&&Object.keys(S.companions).length>=4;let e=trueEnd?'true':S.flags.crownBroken?'break':S.decisions.political==='exile'?'exile':S.honor>=50&&S.decisions.political==='crown'?'crown':S.fame>=80?'fame':S.world.serivia==='developed'?'village':S.wanted>=4?'outlaw':'wanderer';S.ending=e;S.quests.MQ30={...DB.main[29],status:'complete',progress:1};gainXP(1700);checkAchievements();save(slot,true);showEnding(e)}
function showEnding(e){let d={true:['True Ending — Kronik yang Benar','Kau menemukan sejarah yang sengaja dihapus, menyelesaikan rangkaian kesaksian, menjaga sekutu, dan memutus siklus Mahkota. Elarion memasuki zaman baru tanpa mengulang dosa dinastinya.'],break:['Ending — Mahkota Hancur','Kau menghancurkan Mahkota Retak. Kekuasaan lama berakhir, tetapi Elarion harus belajar hidup tanpa simbol yang selama berabad-abad menentukan legitimasi.'],exile:['Ending — Pengasingan Menang','Ravenrock mendapat tempat di meja kekuasaan. Perubahan datang melalui tekanan politik dan negosiasi.'],crown:['Ending — Penjaga Mahkota','Kau menata ulang kerajaan di bawah sumpah baru. Mahkota menjadi simbol, bukan alat penguasaan.'],fame:['Ending — Zaman Kemasyhuran','Namamu menyatukan banyak wilayah. Para pedagang dan rakyat menjadikan kisahmu legenda.'],village:['Ending — Pemulihan Lembah','Perubahan terbesar terjadi di desa-desa. Elarion pulih dari bawah ke atas.'],outlaw:['Ending — Raja Para Buronan','Terlalu banyak aturan telah kau langgar. Sejarah mencatatmu sebagai penantang hukum.'],wanderer:['Ending — Pengembara Abadi','Kau menolak mahkota dan gelar. Jalan masih terbuka, dan rahasia dunia belum habis.']}[e]||['Ending','Elarion berubah karena keputusanmu.'];open(d[0],`<div class="hero"><h1>${esc(d[0])}</h1><p>${esc(d[1])}</p><p class="muted">Cerita utama selesai. Dunia tetap dapat dijelajahi.</p><button onclick="newGamePlus()">Mulai New Game+</button><button onclick="close();go('Beranda')">Kembali ke dunia</button></div>`)}
function newGamePlus(){let keep={achievements:S.achievements.slice(),collection:S.collection.slice(),codex:clone(S.codex),level:S.level};S=fresh();S.newGamePlus=true;S.profile=JSON.parse(JSON.stringify({name:'Aren',title:'Pengembara',gender:'Laki-laki',bg:'Pengembara',desc:'Penerus kronik dari siklus sebelumnya.'}));S.achievements=keep.achievements;S.collection=keep.collection;S.codex=keep.codex;S.level=Math.max(1,keep.level);S.xpNext=Math.floor(100*Math.pow(1.18,S.level-1));S.maxHp+=S.level*8;S.maxMana+=S.level*3;S.stats.attack+=S.level;close();save(1,true);render();toast('New Game+ dimulai. Dialog dan tantangan dunia kini lebih berat.')}
function factionRanks(){return}
function worldEvent(show=true){let ev=['Festival Lentera di Asterra','Konflik buruh di Irondeep','Kabut Hitam di Grimhollow','Pasar Tengah Malam di Lunaris','Sidang darurat di Valedorn','Karavan diserang monster','Harga bijih meningkat','Penjaga memperketat patroli'];let x=ev[Math.floor(Math.random()*ev.length)];S.world.event=x;if(x.includes('Festival'))S.reputation.f2+=2;if(x.includes('Konflik'))S.reputation.f3-=2;if(x.includes('Kabut'))S.reputation.f5-=1;if(x.includes('Pasar'))S.reputation.f2+=3;if(x.includes('patroli'))S.wanted=Math.max(0,S.wanted-1);S.journal.push('World Event: '+x);if(show)toast('Peristiwa dunia: '+x);checkAchievements();save(slot,true);render()}
function runCrime(){S.infamy++;S.wanted++;S.gold+=80;S.reputation.f1-=8;S.reputation.f2-=2;S.journal.push('Kejahatan dilakukan: keuntungan cepat, tetapi Wanted meningkat.');toast('Kejahatan berhasil. Wanted meningkat.');checkAchievements();render()}
function jail(){if(S.wanted<=0)return toast('Tidak ada Wanted Level.');open('Penahanan',`<p>Penjaga telah menangkapmu. Pilih jalan keluar.</p><button class="choice" onclick="payFine()">Bayar denda 150 gold</button><button class="choice" onclick="serve()">Jalani hukuman</button><button class="choice" onclick="persuadeJail()">Gunakan Persuasi</button>`)}function payFine(){if(S.gold<150)return toast('Gold tidak cukup.');S.gold-=150;S.wanted=0;close();render()}function serve(){S.wanted=Math.max(0,S.wanted-2);advance(24);close();render()}function persuadeJail(){if(S.skills.PERSUASION>=4){S.wanted=Math.max(0,S.wanted-2);close();toast('Penjaga menerima alasanmu.');render()}else toast('Skill Persuasi tingkat 4 diperlukan.')}
function professionDummy(){professionUnlocks()}
// Extra actual systems shown through dedicated pages without creating disconnected state.
function partyBonus(){return S.party.length*2}
function peoplePage(){}
function collectionPage(){}
// Add crime and jail controls to Settings so they are reachable and functional.
const oldSettings=settingsPage;settingsPage=function(v){oldSettings(v);$('#view .panel').append(`<hr><h3>Crime & Jail</h3><button onclick="runCrime()">Lakukan pencurian</button><button onclick="jail()">Hadapi Penjaga</button>`)};
// Improve inventory consumption.
function useItem(id){if(!has(id))return;let i=findItem(id);if(i.type!=='Konsumsi')return toast('Item ini tidak dapat digunakan.');removeItem(id);S.hp=Math.min(S.maxHp,S.hp+(i.heal||0));S.mana=Math.min(S.maxMana,S.mana+Math.floor((i.heal||0)/3));toast(i.name+' digunakan.');if(combat)combat.log.push('Menggunakan '+i.name+'.');render()}
window.addEventListener('beforeunload',()=>{if(S&&db)put(STORE,slot,clone(S)).catch(()=>{})});
(async()=>{try{await initDB()}catch(e){toast('IndexedDB tidak tersedia pada browser ini.')}let first=await get(STORE,1).catch(()=>null);if(first){S=normalize(first);slot=1;await loadPhoto();render()}else render();})();
</script></body></html>
