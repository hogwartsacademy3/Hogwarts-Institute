<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --paper:#e8d7a8;
  --paper2:#f2e6c5;
  --ink:#3e2b20;
  --red:#7b1818;
  --gold:#b88b35;
  --green:#315d39;
  --shadow:rgba(40,25,10,.35);
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at center,#eadbb5 0%,#bba47b 100%);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOBBY
========================= */

#lobby{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lobby-card{
  width:min(520px,100%);
  padding:34px;
  border:2px solid #76552d;
  border-radius:18px;
  background:
    linear-gradient(rgba(242,230,197,.94),rgba(225,204,157,.94));
  box-shadow:
    0 20px 60px var(--shadow),
    inset 0 0 0 6px rgba(90,60,25,.08);
  text-align:center;
}

.lobby-card h1{
  font-size:clamp(30px,7vw,52px);
  color:#5b1717;
  margin-bottom:5px;
}

.subtitle{
  font-style:italic;
  opacity:.75;
  margin-bottom:25px;
}

.field{
  text-align:left;
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:14px;
  margin-bottom:6px;
  font-weight:bold;
}

.field input{
  width:100%;
  padding:13px 14px;
  border:1px solid #92754b;
  border-radius:10px;
  background:#f8efd6;
  color:var(--ink);
  outline:none;
}

.field input:focus{
  box-shadow:0 0 0 3px rgba(184,139,53,.25);
}

.main-btn{
  width:100%;
  border:1px solid #573914;
  border-radius:10px;
  padding:13px;
  margin-top:7px;
  background:#6c1717;
  color:#fff4d5;
  font-weight:bold;
}

.main-btn:hover{
  filter:brightness(1.12);
}

.secondary-btn{
  width:100%;
  border:1px solid #80623a;
  border-radius:10px;
  padding:12px;
  margin-top:9px;
  background:#d7bd82;
  color:#382617;
  font-weight:bold;
}

.room-info{
  margin-top:20px;
  padding:15px;
  background:rgba(255,255,255,.25);
  border:1px dashed #8b7045;
  border-radius:12px;
}

.room-code{
  font-size:31px;
  font-weight:bold;
  letter-spacing:7px;
  color:#711919;
  margin:7px 0 12px;
}

.player-list{
  list-style:none;
  text-align:left;
  margin-top:10px;
}

.player-list li{
  padding:7px 9px;
  border-bottom:1px solid rgba(80,50,20,.15);
}

/* =========================
   GAME
========================= */

#game{
  min-height:100vh;
  padding:12px;
}

.game-layout{
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:14px;
  align-items:start;
}

.board-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:8px;
  overflow:hidden;
  box-shadow:
    0 15px 50px rgba(35,20,5,.45),
    0 0 0 4px #6e5131;
  background:#e7d3a1;
}

.board-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ownership/building layer */
.space-markers{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.space-marker{
  position:absolute;
  width:7.5%;
  height:7.5%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.owner-ring{
  position:absolute;
  inset:10%;
  border:3px solid transparent;
  border-radius:50%;
}

.buildings{
  position:absolute;
  bottom:-8%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:2px;
  z-index:2;
}

.house{
  width:7px;
  height:9px;
  background:#24482a;
  border:1px solid #142b18;
  border-radius:1px 1px 2px 2px;
}

.hotel{
  width:13px;
  height:10px;
  background:#791d1d;
  border:1px solid #421010;
  border-radius:2px;
}

.tokens{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.token{
  position:absolute;
  width:30px;
  height:30px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  font-size:14px;
  font-weight:bold;
  color:white;
  text-shadow:0 1px 2px #000;
  box-shadow:0 3px 7px rgba(0,0,0,.45);
  transition:
    left .18s linear,
    top .18s linear;
  z-index:10;
}

.token.current{
  box-shadow:
    0 0 0 3px #fff5bf,
    0 3px 9px rgba(0,0,0,.55);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.panel{
  background:
    linear-gradient(rgba(239,223,183,.96),rgba(219,193,137,.96));
  border:1px solid #806039;
  border-radius:13px;
  box-shadow:0 5px 18px rgba(50,30,10,.22);
  padding:14px;
}

.panel h2{
  color:#641b1b;
  font-size:20px;
  margin-bottom:8px;
}

.you-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.you-token{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  border:2px solid white;
}

.money{
  font-size:21px;
  font-weight:bold;
}

.turn-box{
  padding:10px;
  border-radius:9px;
  background:rgba(123,24,24,.09);
}

.turn-name{
  font-weight:bold;
  color:#681818;
}

.dice-area{
  text-align:center;
}

.dice{
  width:68px;
  height:68px;
  margin:5px auto 10px;
  border:2px solid #46321f;
  border-radius:12px;
  background:#f8efd5;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:9px;
  box-shadow:0 5px 10px rgba(0,0,0,.25);
}

.pip{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#321f17;
  align-self:center;
  justify-self:center;
  opacity:0;
}

.dice.rolling{
  animation:diceShake .12s infinite alternate;
}

@keyframes diceShake{
  from{transform:rotate(-5deg) scale(.98)}
  to{transform:rotate(5deg) scale(1.03)}
}

.dice-btn{
  width:100%;
  padding:11px;
  border:1px solid #533916;
  border-radius:9px;
  background:#7a1b1b;
  color:#fff3cf;
  font-weight:bold;
}

.dice-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.action-grid button{
  border:1px solid #85683d;
  background:#e6d09a;
  color:#392719;
  padding:9px 5px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.action-grid button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.players{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.player-row{
  display:grid;
  grid-template-columns:30px 1fr auto;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:7px;
  background:rgba(255,255,255,.2);
}

.player-dot{
  width:25px;
  height:25px;
  border-radius:50%;
  border:1px solid white;
}

.player-row.active{
  outline:2px solid #b68b36;
  background:rgba(255,239,171,.45);
}

.log{
  max-height:210px;
  overflow:auto;
  font-size:12px;
}

.log p{
  padding:5px 0;
  border-bottom:1px dashed rgba(70,45,20,.18);
}

.property-list{
  max-height:180px;
  overflow:auto;
  font-size:12px;
}

.property-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:5px 0;
  border-bottom:1px dashed rgba(70,45,20,.18);
}

.status{
  font-size:13px;
  line-height:1.45;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(24,14,6,.62);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-card{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#eee0ba;
  border:2px solid #694c29;
  border-radius:16px;
  box-shadow:0 20px 70px #0008;
  padding:20px;
}

.modal-card h2{
  color:#681919;
  margin-bottom:10px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.modal-actions button{
  flex:1;
  padding:11px;
  border:1px solid #71532d;
  border-radius:8px;
  background:#d8bd82;
}

.modal-actions .primary{
  background:#711919;
  color:#fff4d5;
}

.card-effect{
  margin:14px 0;
  padding:15px;
  background:#f7edcf;
  border:1px solid #9c7d4d;
  border-radius:10px;
  line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){
  .game-layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .sidebar .wide{
    grid-column:1/-1;
  }
}

@media(max-width:560px){
  #game{
    padding:6px;
  }

  .sidebar{
    grid-template-columns:1fr;
  }

  .sidebar .wide{
    grid-column:auto;
  }

  .token{
    width:23px;
    height:23px;
    font-size:11px;
  }

  .lobby-card{
    padding:22px;
  }
}

<!-- =========================
     LOBBY
========================= -->

<section id="lobby">
  <div class="lobby-card">

    <h1>Marauder's Map</h1>
    <div class="subtitle">A Wizarding Monopoly Game</div>

    <div class="field">
      <label>Your name</label>
      <input
        id="nameInput"
        maxlength="18"
        placeholder="Harry"
        autocomplete="off"
      >
    </div>

    <button class="main-btn" onclick="createRoom()">
      Create Room
    </button>

    <div style="margin:15px 0;opacity:.55">— OR —</div>

    <div class="field">
      <label>Room code</label>
      <input
        id="roomInput"
        maxlength="8"
        placeholder="ABCD"
        autocomplete="off"
      >
    </div>

    <button class="secondary-btn" onclick="joinRoom()">
      Join Room
    </button>

    <div id="lobbyStatus" style="margin-top:15px"></div>

    <div id="roomPanel" class="room-info hidden">
      <div>Room Code</div>
      <div id="roomCodeDisplay" class="room-code">----</div>

      <div id="hostText"></div>

      <ul id="lobbyPlayers" class="player-list"></ul>

      <button
        id="startButton"
        class="main-btn hidden"
        onclick="startGame()"
      >
        Start Game
      </button>
    </div>

  </div>
</section>


<!-- =========================
     GAME
========================= -->

<section id="game" class="hidden">

  <div class="game-layout">

    <div class="board-wrap">

      <img
        class="board-image"
        src="1f85f40bd819c1388269e062ab04bf99.jpg"
        alt="Marauder's Map Monopoly Board"
      >

      <div id="spaceMarkers" class="space-markers"></div>
      <div id="tokens" class="tokens"></div>

    </div>


    <aside class="sidebar">

      <div class="panel">
        <h2>Your Wizard</h2>

        <div class="you-box">
          <div id="youToken" class="you-token">?</div>

          <div>
            <div id="youName">—</div>
            <div id="youMoney" class="money">$1500</div>
          </div>
        </div>
      </div>


      <div class="panel">
        <h2>Turn</h2>

        <div class="turn-box">
          <div id="turnName" class="turn-name">—</div>
          <div id="turnStatus">Waiting...</div>
        </div>
      </div>


      <div class="panel dice-area">
        <h2>Dice</h2>

        <div id="dice" class="dice">
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
          <span class="pip"></span>
        </div>

        <div id="diceText">—</div>

        <button
          id="rollButton"
          class="dice-btn"
          onclick="rollDice()"
        >
          Roll Dice
        </button>
      </div>


      <div class="panel">
        <h2>Actions</h2>

        <div class="action-grid">
          <button id="buyBtn" onclick="buyProperty()">Buy</button>
          <button id="upgradeBtn" onclick="upgradeProperty()">Upgrade</button>
          <button id="mortgageBtn" onclick="mortgageProperty()">Mortgage</button>
          <button id="unmortgageBtn" onclick="unmortgageProperty()">Unmortgage</button>
          <button id="tradeBtn" onclick="openTrade()">Trade</button>
          <button onclick="endTurn()">End Turn</button>
        </div>
      </div>


      <div class="panel">
        <h2>Players</h2>
        <div id="playersPanel" class="players"></div>
      </div>


      <div class="panel">
        <h2>Your Properties</h2>
        <div id="propertyList" class="property-list"></div>
      </div>


      <div class="panel wide">
        <h2>Journal</h2>
        <div id="logPanel" class="log"></div>
      </div>


      <div class="panel wide">
        <div id="statusPanel" class="status"></div>
      </div>

    </aside>

  </div>
</section>


<!-- =========================
     MODAL
========================= -->

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle">—</h2>
    <div id="modalBody"></div>

    <div class="modal-actions">
      <button onclick="closeModal()">Close</button>
      <button id="modalPrimary" class="primary">OK</button>
    </div>
  </div>
</div>

let state = null;

let moving = false;
let rolling = false;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function uid(){
  return Math.random().toString(36).slice(2,10)
    + Date.now().toString(36);
}

function roomCodeGenerator(){
  return Math.random()
    .toString(36)
    .substring(2,6)
    .toUpperCase();
}

function money(n){
  return "$" + Math.round(n).toLocaleString();
}

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function currentPlayer(){
  if(!state) return null;
  return state.players.find(
    p => p.id === state.players[state.turn]?.id
  ) || state.players[state.turn];
}

function me(){
  return state?.players.find(
    p => p.id === localPlayerId
  );
}

function isMyTurn(){
  return !!(
    state &&
    state.players[state.turn] &&
    state.players[state.turn].id === localPlayerId
  );
}

function ownedByMe(index){
  return state?.spaces[index]?.owner === localPlayerId;
}

function getProperty(index){
  return state?.properties?.[index];
}


/* =========================================================
   INITIAL STATE
========================================================= */

function createInitialState(){

  return {

    started:false,
    finished:false,

    turn:0,

    players:[],

    spaces:SPACES.map((s,i)=>({
      ...s,
      owner:null,
      houses:0,
      mortgaged:false
    })),

    lastRoll:null,
    rolled:false,
    canBuy:false,

    logs:[],

    createdAt:Date.now()

  };
}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom(){

  const name =
    $("nameInput").value.trim();

  if(!name){
    setLobbyStatus("Masukkan nama dulu.");
    return;
  }

  const code = await findFreeRoom();

  if(!code){
    setLobbyStatus("Gagal membuat room. Coba lagi.");
    return;
  }

  roomCode = code;

  localPlayerId = uid();

  state = createInitialState();

  state.players.push({
    id:localPlayerId,
    name:name,
    money:1500,
    position:0,
    color:COLORS[0],
    letter:TOKEN_LETTERS[0],
    inJail:false,
    jailTurns:0,
    getOut:false,
    bankrupt:false
  });

  state.logs.push({
    text:`${name} membuat room ${code}.`,
    time:Date.now()
  });

  const {error} = await supabaseClient
    .from("monopoly_games")
    .insert({
      room_code:code,
      state:state
    });

  if(error){
    console.error(error);
    setLobbyStatus(
      "Gagal membuat room: " + error.message
    );
    return;
  }

  localStorage.setItem(
    "marauder_room",
    code
  );

  localStorage.setItem(
    "marauder_player",
    localPlayerId
  );

  showRoom();

  subscribeRoom();

  renderLobby();

}


/* =========================================================
   FIND FREE ROOM
========================================================= */

async function findFreeRoom(){

  for(let i=0;i<10;i++){

    const code = roomCodeGenerator();

    const {data} = await supabaseClient
      .from("monopoly_games")
      .select("id")
      .eq("room_code",code)
      .maybeSingle();

    if(!data){
      return code;
    }
  }

  return null;
}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom(){

  const name =
    $("nameInput").value.trim();

  const code =
    $("roomInput").value
      .trim()
      .toUpperCase();

  if(!name){
    setLobbyStatus("Masukkan nama dulu.");
    return;
  }

  if(!code){
    setLobbyStatus("Masukkan room code.");
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("monopoly_games")
      .select("*")
      .eq("room_code",code)
      .maybeSingle();

  if(error || !data){
    setLobbyStatus("Room tidak ditemukan.");
    return;
  }

  state = data.state;
  roomCode = code;

  if(state.started){
    setLobbyStatus(
      "Game ini sudah dimulai."
    );
    return;
  }

  if(state.players.length >= 8){
    setLobbyStatus(
      "Room sudah penuh."
    );
    return;
  }

  localPlayerId = uid();

  state.players.push({
    id:localPlayerId,
    name:name,
    money:1500,
    position:0,
    color:COLORS[state.players.length % COLORS.length],
    letter:TOKEN_LETTERS[state.players.length % TOKEN_LETTERS.length],
    inJail:false,
    jailTurns:0,
    getOut:false,
    bankrupt:false
  });

  state.logs.push({
    text:`${name} bergabung ke room.`,
    time:Date.now()
  });

  await saveState();

  localStorage.setItem(
    "marauder_room",
    code
  );

  localStorage.setItem(
    "marauder_player",
    localPlayerId
  );

  showRoom();

  subscribeRoom();

  renderLobby();
}


/* =========================================================
   ROOM UI
========================================================= */

function showRoom(){

  $("roomPanel")
    .classList.remove("hidden");

  $("roomCodeDisplay")
    .textContent = roomCode;

}

function setLobbyStatus(text){
  $("lobbyStatus").textContent = text;
}

function renderLobby(){

  if(!state) return;

  showRoom();

  $("lobbyPlayers").innerHTML =
    state.players.map((p,i)=>`
      <li>
        ${escapeHTML(p.name)}
        ${i === 0 ? " — HOST" : ""}
      </li>
    `).join("");

  const host =
    state.players[0]?.id === localPlayerId;

  $("hostText").textContent =
    host
      ? "Lu adalah host. Tunggu pemain lain."
      : "Menunggu host memulai game.";

  $("startButton")
    .classList.toggle(
      "hidden",
      !host || state.players.length < 2
    );

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

  if(!state) return;

  if(state.players.length < 2){
    alert("Minimal 2 pemain.");
    return;
  }

  if(state.players[0].id !== localPlayerId){
    return;
  }

  state.started = true;

  state.logs.push({
    text:"Game dimulai!",
    time:Date.now()
  });

  await saveState();

  enterGame();

}


/* =========================================================
   ENTER GAME
========================================================= */

function enterGame(){

  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");

  render();

}


/* =========================================================
   SAVE
========================================================= */

async function saveState(){

  if(!roomCode || !state) return;

  const snapshot =
    JSON.parse(JSON.stringify(state));

  const {error} =
    await supabaseClient
      .from("monopoly_games")
      .update({
        state:snapshot,
        updated_at:new Date().toISOString()
      })
      .eq("room_code",roomCode);

  if(error){
    console.error(error);
  }
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRoom(){

  if(realtimeChannel){
    supabaseClient.removeChannel(
      realtimeChannel
    );
  }

  realtimeChannel =
    supabaseClient
      .channel("marauder-room-" + roomCode)
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"monopoly_games",
          filter:`room_code=eq.${roomCode}`
        },
        payload => {

          if(!payload.new?.state)
            return;

          const incoming =
            payload.new.state;

          if(
            JSON.stringify(incoming)
            === JSON.stringify(state)
          ){
            return;
          }

          state = incoming;

          if(state.started){
            enterGame();
          }else{
            renderLobby();
          }

          render();

        }
      )
      .subscribe();

}


/* =========================================================
   DICE
========================================================= */

const DICE_PATTERNS = {

  1:[4],

  2:[0,8],

  3:[0,4,8],

  4:[0,2,6,8],

  5:[0,2,4,6,8],

  6:[0,2,3,5,6,8]

};

function showDice(value){

  const pips =
    $("dice").querySelectorAll(".pip");

  pips.forEach(
    p => p.style.opacity = "0"
  );

  const indexes =
    DICE_PATTERNS[value] || [];

  indexes.forEach(i=>{
    pips[i].style.opacity = "1";
  });

  $("diceText").textContent =
    value ? `${value}` : "—";
}


async function rollDice(){

  if(
    !state ||
    !isMyTurn() ||
    moving ||
    rolling ||
    state.rolled ||
    state.finished
  ){
    return;
  }

  const player =
    state.players[state.turn];

  rolling = true;

  $("rollButton").disabled = true;

  $("dice").classList.add("rolling");

  let temp = 1;

  for(let i=0;i<12;i++){

    temp =
      Math.floor(Math.random()*6)+1;

    showDice(temp);

    await sleep(70);

  }

  $("dice").classList.remove("rolling");

  const d1 =
    Math.floor(Math.random()*6)+1;

  const d2 =
    Math.floor(Math.random()*6)+1;

  const total =
    d1+d2;

  state.lastRoll = {
    d1,
    d2,
    total
  };

  state.rolled = true;

  state.canBuy = false;

  showDice(d1);

  await sleep(180);

  showDice(d2);

  await sleep(250);

  addLog(
    `${player.name} melempar ${d1} + ${d2} = ${total}.`
  );

  rolling = false;

  await movePlayer(
    player,
    total
  );

}


/* =========================================================
   MOVE PLAYER — ONE SQUARE AT A TIME
========================================================= */

async function movePlayer(player,total){

  moving = true;

  for(let i=0;i<total;i++){

    player.position =
      (player.position + 1) % 40;

    if(player.position === 0){
      player.money += 200;

      addLog(
        `${player.name} melewati GO dan mendapat $200.`
      );
    }

    renderTokens();

    await sleep(190);
  }

  moving = false;

  await landOnSpace(player);

}


/* =========================================================
   LAND ON SPACE
========================================================= */

async function landOnSpace(player){

  const index =
    player.position;

  const space =
    state.spaces[index];

  state.canBuy = false;

  if(space.type === "go"){
    addLog(`${player.name} berhenti di GO.`);
  }

  else if(space.type === "property"){
    await handleProperty(player,index);
  }

  else if(space.type === "railroad"){
    await handleRailroad(player,index);
  }

  else if(space.type === "utility"){
    await handleUtility(player,index);
  }

  else if(space.type === "tax"){
    await payBank(
      player,
      space.amount,
      `${space.name}: ${money(space.amount)}`
    );
  }

  else if(space.type === "chance"){
    drawChance(player);
  }

  else if(space.type === "chest"){
    drawChest(player);
  }

  else if(space.type === "gotojail"){
    sendToJail(player);
  }

  else if(space.type === "jail"){
    if(player.inJail){
      addLog(
        `${player.name} masih berada di Jail.`
      );
    }
  }

  else if(space.type === "parking"){
    addLog(
      `${player.name} berhenti di Free Parking.`
    );
  }

  await saveState();

  render();

}


/* =========================================================
   PROPERTY
========================================================= */

async function handleProperty(player,index){

  const space =
    state.spaces[index];

  if(!space.owner){

    if(player.money >= space.price){

      state.canBuy = true;

      addLog(
        `${space.name} tersedia untuk dibeli seharga ${money(space.price)}.`
      );

    }else{

      addLog(
        `${player.name} tidak punya cukup uang untuk membeli ${space.name}.`
      );

    }

    return;
  }

  if(space.owner === player.id){

    addLog(
      `${player.name} mendarat di ${space.name} miliknya.`
    );

    return;
  }

  const owner =
    state.players.find(
      p => p.id === space.owner
    );

  if(!owner) return;

  let rent =
    calculateRent(index);

  if(space.mortgaged){
    rent = 0;
  }

  if(rent > 0){

    const paid =
      Math.min(player.money,rent);

    player.money -= paid;
    owner.money += paid;

    addLog(
      `${player.name} membayar ${money(paid)} kepada ${owner.name} untuk ${space.name}.`
    );

    if(player.money <= 0){
      checkBankruptcy(player);
    }

  }else{

    addLog(
      `${space.name} sedang digadaikan. Tidak ada sewa.`
    );

  }

}


/* =========================================================
   RENT
========================================================= */

function calculateRent(index){

  const space =
    state.spaces[index];

  if(!space.owner)
    return 0;

  if(space.type === "property"){

    let rent =
      space.rent[
        Math.min(space.houses,5)
      ];

    const owner =
      state.players.find(
        p => p.id === space.owner
      );

    const ownsGroup =
      state.spaces
        .filter(s =>
          s.type === "property" &&
          s.group === space.group
        )
        .every(s =>
          s.owner === space.owner
        );

    if(
      ownsGroup &&
      space.houses === 0
    ){
      rent *= 2;
    }

    return rent;
  }

  if(space.type === "railroad"){

    const count =
      state.spaces.filter(
        s =>
          s.type === "railroad" &&
          s.owner === space.owner
      ).length;

    return [0,25,50,100,200][count] || 25;
  }

  if(space.type === "utility"){

    const count =
      state.spaces.filter(
        s =>
          s.type === "utility" &&
          s.owner === space.owner
      ).length;

    const dice =
      state.lastRoll?.total || 7;

    return dice * (count >= 2 ? 10 : 4);
  }

  return 0;
}


/* =========================================================
   BUY
========================================================= */

async function buyProperty(){

  if(
    !isMyTurn() ||
    !state.canBuy ||
    state.finished
  ){
    return;
  }

  const player = me();

  const index =
    player.position;

  const space =
    state.spaces[index];

  if(
    space.type !== "property" &&
    space.type !== "railroad" &&
    space.type !== "utility"
  ){
    return;
  }

  if(space.owner){
    return;
  }

  if(player.money < space.price){
    return;
  }

  player.money -= space.price;

  space.owner =
    player.id;

  space.houses = 0;
  space.mortgaged = false;

  state.canBuy = false;

  addLog(
    `${player.name} membeli ${space.name} seharga ${money(space.price)}.`
  );

  await saveState();

  render();

}


/* =========================================================
   UPGRADE
========================================================= */

async function upgradeProperty(){

  if(!isMyTurn())
    return;

  const player = me();

  const index =
    player.position;

  const space =
    state.spaces[index];

  if(
    space.type !== "property" ||
    space.owner !== player.id
  ){
    alert(
      "Lu harus berdiri di properti milik lu."
    );
    return;
  }

  if(space.houses >= 5){
    alert("Properti ini sudah maksimal.");
    return;
  }

  const groupProperties =
    state.spaces.filter(
      s =>
        s.type === "property" &&
        s.group === space.group
    );

  const monopoly =
    groupProperties.every(
      s => s.owner === player.id
    );

  if(!monopoly){
    alert(
      "Lu harus memiliki seluruh properti dalam kelompok ini."
    );
    return;
  }

  if(player.money < space.houseCost){
    alert("Uang tidak cukup.");
    return;
  }

  player.money -=
    space.houseCost;

  space.houses++;

  addLog(
    `${player.name} meningkatkan ${space.name}.`
  );

  await saveState();

  render();

}


/* =========================================================
   MORTGAGE
========================================================= */

async function mortgageProperty(){

  const player = me();

  const index =
    player.position;

  const space =
    state.spaces[index];

  if(
    !space ||
    space.owner !== player.id
  ){
    alert(
      "Berdiri di properti milik lu dulu."
    );
    return;
  }

  if(space.mortgaged){
    return;
  }

  if(space.houses > 0){
    alert(
      "Jual rumah/hotel dulu sebelum mortgage."
    );
    return;
  }

  const value =
    Math.floor(space.price/2);

  space.mortgaged = true;

  player.money += value;

  addLog(
    `${space.name} digadaikan. ${money(value)} diterima.`
  );

  await saveState();

  render();

}


/* =========================================================
   UNMORTGAGE
========================================================= */

async function unmortgageProperty(){

  const player = me();

  const index =
    player.position;

  const space =
    state.spaces[index];

  if(
    !space ||
    space.owner !== player.id ||
    !space.mortgaged
  ){
    return;
  }

  const cost =
    Math.ceil(space.price * .55);

  if(player.money < cost){
    alert("Uang tidak cukup.");
    return;
  }

  player.money -= cost;

  space.mortgaged = false;

  addLog(
    `${player.name} menebus kembali ${space.name}.`
  );

  await saveState();

  render();

}


/* =========================================================
   RAILROAD
========================================================= */

async function handleRailroad(player,index){

  const space =
    state.spaces[index];

  if(!space.owner){

    if(player.money >= space.price){
      state.canBuy = true;

      addLog(
        `${space.name} bisa dibeli seharga ${money(space.price)}.`
      );
    }

    return;
  }

  if(space.owner === player.id)
    return;

  const owner =
    state.players.find(
      p=>p.id===space.owner
    );

  const rent =
    calculateRent(index);

  player.money -= rent;
  owner.money += rent;

  addLog(
    `${player.name} membayar ${money(rent)} kepada ${owner.name}.`
  );

  checkBankruptcy(player);

}

/* =========================================================
   TAX
========================================================= */

async function payBank(player,amount,text){

  player.money -= amount;

  addLog(
    `${player.name} membayar ${text}.`
  );

  checkBankruptcy(player);

}


/* =========================================================
   JAIL
========================================================= */

function sendToJail(player){

  player.position = 10;
  player.inJail = true;
  player.jailTurns = 0;

  addLog(
    `${player.name} dikirim ke Jail.`
  );

  renderTokens();

}

function drawChance(player){

  const card =
    CHANCE_CARDS[
      Math.floor(
        Math.random()*CHANCE_CARDS.length
      )
    ];

  const result =
    card.effect(player);

  addLog(
    `Chance: ${card.text} (${result})`
  );

  showCard(
    "Chance",
    card.text,
    result
  );

  checkBankruptcy(player);

}


function drawChest(player){

  const card =
    CHEST_CARDS[
      Math.floor(
        Math.random()*CHEST_CARDS.length
      )
    ];

  const result =
    card.effect(player);

  addLog(
    `Community Chest: ${card.text} (${result})`
  );

  showCard(
    "Community Chest",
    card.text,
    result
  );

  checkBankruptcy(player);

}


function moveTo(player,index){

  if(index === 0 &&
     player.position !== 0){
    player.money += 200;
  }

  player.position = index;
}


/* =========================================================
   END TURN
========================================================= */

async function endTurn(){

  if(
    !isMyTurn() ||
    moving ||
    rolling
  ){
    return;
  }

  if(!state.rolled){
    alert("Roll dadu dulu.");
    return;
  }

  const roll =
    state.lastRoll;

  state.canBuy = false;

  /*
    Doubles:
    Player gets another turn.
    Otherwise turn passes.
  */

  if(
    roll &&
    roll.d1 === roll.d2
  ){

    addLog(
      `${me().name} mendapat double dan boleh melempar lagi.`
    );

    state.rolled = false;
    state.lastRoll = null;

    showDice(1);

    await saveState();

    render();

    return;
  }

  nextTurn();

  await saveState();

  render();

}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

  if(!state)
    return;

  let attempts = 0;

  do{

    state.turn =
      (state.turn+1)
      % state.players.length;

    attempts++;

  }while(
    state.players[state.turn].bankrupt &&
    attempts < state.players.length+1
  );

  state.rolled = false;
  state.lastRoll = null;
  state.canBuy = false;

  addLog(
    `Giliran ${state.players[state.turn].name}.`
  );

}


/* =========================================================
   BANKRUPTCY
========================================================= */

function checkBankruptcy(player){

  if(player.money > 0)
    return;

  player.bankrupt = true;

  /*
    Release all properties.
  */

  state.spaces.forEach(space=>{

    if(space.owner === player.id){

      space.owner = null;
      space.houses = 0;
      space.mortgaged = false;

    }

  });

  addLog(
    `${player.name} bangkrut dan keluar dari permainan.`
  );

  const alive =
    state.players.filter(
      p => !p.bankrupt
    );

  if(alive.length <= 1){

    state.finished = true;

    const winner = alive[0];

    if(winner){

      addLog(
        `${winner.name} memenangkan permainan!`
      );

      showCard(
        "GAME OVER",
        `${winner.name} memenangkan permainan!`,
        "Selamat!"
      );

    }

  }

}


/* =========================================================
   TRADE
========================================================= */

function openTrade(){

  const player = me();

  if(!player){
    return;
  }

  const others =
    state.players.filter(
      p =>
        p.id !== player.id &&
        !p.bankrupt
    );

  if(!others.length){
    alert("Tidak ada pemain lain.");
    return;
  }

  const target =
    prompt(
      "Nama pemain yang mau diajak trade:\n\n" +
      others.map(p=>p.name).join("\n")
    );

  if(!target)
    return;

  const receiver =
    others.find(
      p =>
        p.name.toLowerCase()
        === target.toLowerCase()
    );

  if(!receiver){
    alert("Pemain tidak ditemukan.");
    return;
  }

  const owned =
    state.spaces.filter(
      s => s.owner === player.id
    );

  if(!owned.length){
    alert("Lu belum punya properti.");
    return;
  }

  const propertyName =
    prompt(
      "Nama properti yang mau ditawarkan:\n\n" +
      owned.map(s=>s.name).join("\n")
    );

  const property =
    owned.find(
      s =>
        s.name.toLowerCase()
        === propertyName?.toLowerCase()
    );

  if(!property){
    alert("Properti tidak ditemukan.");
    return;
  }

  const amount =
    Number(
      prompt(
        `Berapa uang yang diminta dari ${receiver.name}?`
      )
    );

  if(
    !Number.isFinite(amount) ||
    amount < 0
  ){
    return;
  }

  if(receiver.money < amount){
    alert("Uang pemain tersebut tidak cukup.");
    return;
  }

  /*
    Simplified instant trade.
    For a private friends-only game this keeps
    the UI simple.
  */

  receiver.money -= amount;
  player.money += amount;

  property.owner =
    receiver.id;

  addLog(
    `${player.name} menjual ${property.name} kepada ${receiver.name} seharga ${money(amount)}.`
  );

  saveState();
  render();

}


/* =========================================================
   BOARD COORDINATES
   40 positions around the uploaded image.
========================================================= */

function getBoardCoord(index){

  /*
    0 = bottom-right
    10 = bottom-left
    20 = top-left
    30 = top-right

    11 positions per side.
  */

  const points = [];

  /*
    Bottom:
    0 -> 10
  */

  for(let i=0;i<=10;i++){

    points.push({
      x:95-(90*(i/10)),
      y:94
    });

  }

  /*
    Left:
    11 -> 20
  */

  for(let i=1;i<=10;i++){

    points.push({
      x:5,
      y:94-(90*(i/10))
    });

  }

  /*
    Top:
    21 -> 30
  */

  for(let i=1;i<=10;i++){

    points.push({
      x:5+(90*(i/10)),
      y:5
    });

  }

  /*
    Right:
    31 -> 39
  */

  for(let i=1;i<10;i++){

    points.push({
      x:95,
      y:5+(90*(i/10))
    });

  }

  return points[index] || {
    x:50,
    y:50
  };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  if(!state)
    return;

  renderTokens();
  renderMarkers();
  renderPlayers();
  renderProperties();
  renderLogs();
  renderTurn();
  renderActions();

  if(
    state.started &&
    $("game").classList.contains("hidden")
  ){
    enterGame();
  }

}


/* =========================================================
   TOKENS
========================================================= */

function renderTokens(){

  if(!state)
    return;

  const container =
    $("tokens");

  container.innerHTML = "";

  state.players
    .filter(p=>!p.bankrupt)
    .forEach((p,index)=>{

      const pos =
        getBoardCoord(p.position);

      /*
        Slight offset so multiple tokens
        don't completely overlap.
      */

      const samePosition =
        state.players.filter(
          x =>
            !x.bankrupt &&
            x.position === p.position
        );

      const slot =
        samePosition.indexOf(p);

      const offsetX =
        ((slot % 3)-1)*12;

      const offsetY =
        (Math.floor(slot/3))*12;

      const token =
        document.createElement("div");

      token.className =
        "token" +
        (
          p.id ===
          state.players[state.turn]?.id
            ? " current"
            : ""
        );

      token.style.left =
        `calc(${pos.x}% + ${offsetX}px)`;

      token.style.top =
        `calc(${pos.y}% + ${offsetY}px)`;

      token.style.background =
        p.color;

      token.textContent =
        p.letter;

      token.title =
        p.name;

      container.appendChild(token);

    });

}


/* =========================================================
   OWNER MARKERS + BUILDINGS
========================================================= */

function renderMarkers(){

  if(!state)
    return;

  const container =
    $("spaceMarkers");

  container.innerHTML = "";

  state.spaces.forEach((space,index)=>{

    if(!space.owner)
      return;

    const owner =
      state.players.find(
        p=>p.id===space.owner
      );

    if(!owner)
      return;

    const pos =
      getBoardCoord(index);

    const marker =
      document.createElement("div");

    marker.className =
      "space-marker";

    marker.style.left =
      pos.x + "%";

    marker.style.top =
      pos.y + "%";

    const ring =
      document.createElement("div");

    ring.className =
      "owner-ring";

    ring.style.borderColor =
      owner.color;

    marker.appendChild(ring);

    if(space.type === "property"){

      const buildings =
        document.createElement("div");

      buildings.className =
        "buildings";

      if(space.houses >= 5){

        const hotel =
          document.createElement("div");

        hotel.className =
          "hotel";

        buildings.appendChild(hotel);

      }else{

        for(
          let i=0;
          i<space.houses;
          i++
        ){

          const house =
            document.createElement("div");

          house.className =
            "house";

          buildings.appendChild(house);

        }

      }

      marker.appendChild(buildings);

    }

    container.appendChild(marker);

  });

}


/* =========================================================
   PLAYERS PANEL
========================================================= */

function renderPlayers(){

  const container =
    $("playersPanel");

  container.innerHTML =
    state.players.map(p=>`

      <div class="player-row ${
        p.id === state.players[state.turn]?.id
          ? "active"
          : ""
      }">

        <div
          class="player-dot"
          style="background:${p.color}"
        ></div>

        <div>
          <strong>${escapeHTML(p.name)}</strong>
          ${
            p.id === localPlayerId
              ? " <small>(You)</small>"
              : ""
          }
          ${
            p.bankrupt
              ? " <small>— BANKRUPT</small>"
              : ""
          }
        </div>

        <div>
          ${money(p.money)}
        </div>

      </div>

    `).join("");

}


/* =========================================================
   PROPERTY PANEL
========================================================= */

function renderProperties(){

  const mine =
    state.spaces.filter(
      s => s.owner === localPlayerId
    );

  $("propertyList").innerHTML =
    mine.length

      ? mine.map(s=>`

          <div class="property-item">

            <span>
              ${escapeHTML(s.name)}
              ${
                s.mortgaged
                  ? " — Mortgaged"
                  : ""
              }
            </span>

            <strong>
              ${
                s.type === "property"
                  ? `${s.houses}/5`
                  : "Owned"
              }
            </strong>

          </div>

        `).join("")

      : "<div>Belum punya properti.</div>";

}


/* =========================================================
   LOG
========================================================= */

function renderLogs(){

  const container =
    $("logPanel");

  container.innerHTML =
    state.logs
      .slice(-30)
      .reverse()
      .map(
        l =>
          `<p>${escapeHTML(l.text)}</p>`
      )
      .join("");

}


/* =========================================================
   TURN
========================================================= */

function renderTurn(){

  const current =
    state.players[state.turn];

  if(!current)
    return;

  $("turnName").textContent =
    current.name;

  let status =
    isMyTurn()
      ? "Giliran lu."
      : "Tunggu pemain lain.";

  if(state.finished){
    status = "Game selesai.";
  }

  $("turnStatus").textContent =
    status;

  const player =
    me();

  if(player){

    $("youName").textContent =
      player.name;

    $("youMoney").textContent =
      money(player.money);

    $("youToken").textContent =
      player.letter;

    $("youToken").style.background =
      player.color;

  }

}


/* =========================================================
   ACTION BUTTONS
========================================================= */

function renderActions(){

  const my =
    me();

  const myTurn =
    isMyTurn();

  $("rollButton").disabled =
    !myTurn ||
    state.rolled ||
    moving ||
    rolling ||
    state.finished;

  $("buyBtn").disabled =
    !myTurn ||
    !state.canBuy ||
    state.finished;

  const currentSpace =
    my
      ? state.spaces[my.position]
      : null;

  $("upgradeBtn").disabled =
    !myTurn ||
    !currentSpace ||
    currentSpace.type !== "property" ||
    currentSpace.owner !== localPlayerId ||
    state.finished;

  $("mortgageBtn").disabled =
    !myTurn ||
    !currentSpace ||
    currentSpace.owner !== localPlayerId ||
    currentSpace.mortgaged ||
    state.finished;

  $("unmortgageBtn").disabled =
    !myTurn ||
    !currentSpace ||
    currentSpace.owner !== localPlayerId ||
    !currentSpace.mortgaged ||
    state.finished;

  $("tradeBtn").disabled =
    !my ||
    my.bankrupt ||
    state.finished;

  const status =
    currentSpace
      ? `
        Lu berada di:
        <strong>${escapeHTML(currentSpace.name)}</strong>
        <br>
        Posisi: ${my.position}/39
        ${
          currentSpace.owner
            ? `<br>Owner: ${
                escapeHTML(
                  state.players.find(
                    p=>p.id===currentSpace.owner
                  )?.name || "Unknown"
                )
              }`
            : ""
        }
      `
      : "";

  $("statusPanel").innerHTML =
    status;

}


/* =========================================================
   MODAL
========================================================= */

function showCard(title,text,result){

  $("modalTitle").textContent =
    title;

  $("modalBody").innerHTML =
    `
      <div class="card-effect">
        ${escapeHTML(text)}
        <br><br>
        <strong>${escapeHTML(result)}</strong>
      </div>
    `;

  $("modalPrimary").onclick =
    closeModal;

  $("modal").classList.remove("hidden");

}


function closeModal(){

  $("modal")
    .classList.add("hidden");

}


/* =========================================================
   LOGGING
========================================================= */

function addLog(text){

  if(!state)
    return;

  state.logs.push({
    text,
    time:Date.now()
  });

  if(state.logs.length > 100){
    state.logs =
      state.logs.slice(-100);
  }

}


/* =========================================================
   UTIL
========================================================= */

function sleep(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}


/* =========================================================
   AUTO RECONNECT
========================================================= */

async function tryReconnect(){

  const savedRoom =
    localStorage.getItem(
      "marauder_room"
    );

  const savedPlayer =
    localStorage.getItem(
      "marauder_player"
    );

  if(
    !savedRoom ||
    !savedPlayer
  ){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("monopoly_games")
      .select("*")
      .eq("room_code",savedRoom)
      .maybeSingle();

  if(error || !data){
    return;
  }

  const found =
    data.state.players.find(
      p => p.id === savedPlayer
    );

  if(!found){
    return;
  }

  roomCode =
    savedRoom;

  localPlayerId =
    savedPlayer;

  state =
    data.state;

  subscribeRoom();

  if(state.started){
    enterGame();
  }else{
    renderLobby();
  }

}


/* =========================================================
   INIT
========================================================= */

showDice(1);

tryReconnect();

</script>
